const MAXW = matchMedia('(max-width:520px)').matches ? 11 : 14, TARGET = matchMedia('(max-width:520px)').matches ? 11 : 13;
const K = (r, c) => r + ',' + c;
function build(){
  let best = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const pool = shuffle(BANK.slice()), g = new Map(), placed = []; let r0 = 0, r1 = 0, c0 = 0, c1 = 0;
    const fits = (w, r, c, dir) => {
      const dr = dir === 'd' ? 1 : 0, dc = dir === 'a' ? 1 : 0, re = r + dr * (w.length - 1), ce = c + dc * (w.length - 1);
      if (Math.max(r1, re) - Math.min(r0, r) + 1 > MAXW || Math.max(c1, ce) - Math.min(c0, c) + 1 > MAXW) return 0;
      if (g.has(K(r - dr, c - dc)) || g.has(K(re + dr, ce + dc))) return 0;
      let cross = 0;
      for (let i = 0; i < w.length; i++) {
        const rr = r + dr * i, cc = c + dc * i, cell = g.get(K(rr, cc));
        if (cell) { if (cell.ch !== w[i] || cell[dir]) return 0; cross++; }
        else if (dir === 'a' ? g.has(K(rr - 1, cc)) || g.has(K(rr + 1, cc)) : g.has(K(rr, cc - 1)) || g.has(K(rr, cc + 1))) return 0;
      }
      return cross;
    };
    const put = (it, r, c, dir) => {
      const dr = dir === 'd' ? 1 : 0, dc = dir === 'a' ? 1 : 0;
      for (let i = 0; i < it.w.length; i++) { const k = K(r + dr * i, c + dc * i), cell = g.get(k) || {ch: it.w[i]}; cell[dir] = true; g.set(k, cell); }
      placed.push({w: it.w, c: it.c, r, col: c, dir}); r0 = Math.min(r0, r); c0 = Math.min(c0, c); r1 = Math.max(r1, r + dr * (it.w.length - 1)); c1 = Math.max(c1, c + dc * (it.w.length - 1));
    };
    const first = pool.find(x => x.w.length >= 6 && x.w.length <= 9); put(first, 0, 0, Math.random() < .5 ? 'a' : 'd');
    for (const it of pool) {
      if (placed.length >= TARGET) break; if (placed.some(p => p.w === it.w)) continue;
      let cands = [];
      for (const p of placed) for (let i = 0; i < it.w.length; i++) for (let j = 0; j < p.w.length; j++) {
        if (it.w[i] !== p.w[j]) continue;
        const dir = p.dir === 'a' ? 'd' : 'a', r = p.dir === 'a' ? p.r - i : p.r + j, c = p.dir === 'a' ? p.col + j : p.col - i, x = fits(it.w, r, c, dir);
        if (x > 0) cands.push({r, c, dir, x});
      }
      if (!cands.length) continue;
      const mx = Math.max(...cands.map(o => o.x)); cands = cands.filter(o => o.x === mx); const o = cands[Math.random() * cands.length | 0]; put(it, o.r, o.c, o.dir);
    }
    const W = c1 - c0 + 1, H = r1 - r0 + 1, score = placed.length * 1000 - W * H - Math.abs(W - H) * 8;
    if (!best || score > best.score) best = {score, W, H, words: placed.map(p => ({w: p.w, c: p.c, r: p.r - r0, col: p.col - c0, dir: p.dir}))};

  for (const w of best.words) { const k = K(w.r, w.col); if (!starts.has(k)) starts.set(k, ++n); w.num = starts.get(k); }

}

let P = null, cur = {r: 0, c: 0, dir: 'a'}, bad = new Set(), done = false;
const coarse = matchMedia('(pointer:coarse)').matches, kb = $('kb');
const cellsOf = w => Array.from({length: w.w.length}, (_, i) => [w.r + (w.dir === 'd' ? i : 0), w.col + (w.dir === 'a' ? i : 0)]);

function index(){ SOL = new Map(); P.words.forEach((w, wi) => cellsOf(w).forEach(([r, c], i) => { const k = K(r, c), e = SOL.get(k) || {ch: w.w[i]}; e[w.dir] = wi; SOL.set(k, e); })); }

const curWord = () => wordAt(cur.r, cur.c, cur.dir) || wordAt(cur.r, cur.c, cur.dir === 'a' ? 'd' : 'a');
const wordDone = w => cellsOf(w).every(([r, c]) => P.vals[K(r, c)] === SOL.get(K(r, c)).ch);

function newGame(){ P = build(); index(); bad = new Set(); done = false; const w = P.words[0]; cur = {r: w.r, c: w.col, dir: w.dir}; closeModal(); save(); draw(); }
function save(){ if (P && !done) ls.set('arc_cw_save', P); }
function draw(){
  const cw = $('cw'); cw.style.gridTemplateColumns = 'repeat(' + P.W + ',var(--cs,34px))';
  const avail = $('gw').clientWidth - 4, cs = Math.max(20, Math.min(46, Math.floor((avail - (P.W - 1) * 2) / P.W)));
  cw.style.setProperty('--cs', cs + 'px');
  const w = curWord(); if (w) cur.dir = w.dir; const inW = new Set(w ? cellsOf(w).map(([r, c]) => K(r, c)) : []);
  const nums = new Map(); P.words.forEach(x => nums.set(K(x.r, x.col), x.num));
  const doneCells = new Set(); P.words.forEach(x => { if (wordDone(x)) cellsOf(x).forEach(([r, c]) => doneCells.add(K(r, c))); });
  let h = '';
  for (let r = 0; r < P.H; r++) for (let c = 0; c < P.W; c++) {
    const k = K(r, c); if (!SOL.has(k)) { h += '<span class="x"></span>'; continue; }
    const v = P.vals[k] || '';
    h += '<button type="button" class="k' + (inW.has(k) ? ' in' : '') + (r === cur.r && c === cur.c ? ' cur' : '') + (bad.has(k) ? ' bad' : '') + (P.rev[k] ? ' rev' : '') + (doneCells.has(k) ? ' done' : '') + '" data-k="' + k + '" aria-label="Case ' + (r + 1) + '-' + (c + 1) + (v ? ', ' + v : ', vide') + '">' + (nums.has(k) ? '<i>' + nums.get(k) + '</i>' : '') + v + '</button>';
  }
  cw.innerHTML = h;
  $('clueTxt').innerHTML = w ? '<b>' + w.num + (w.dir === 'a' ? ' →' : ' ↓') + '</b>' + esc(w.c) + ' <span class="note">(' + w.w.length + ' lettres)</span>' : '';
  const li = d => P.words.map((x, i) => ({x, i})).filter(o => o.x.dir === d).sort((a, b) => a.x.num - b.x.num).map(o => '<li data-w="' + o.i + '" class="' + (o.x === w ? 'on' : '') + (wordDone(o.x) ? ' ok' : '') + '"><b>' + o.x.num + '</b> ' + esc(o.x.c) + '</li>').join('');
  $('la').innerHTML = li('a'); $('ld').innerHTML = li('d');
  const on = document.querySelector('.lists li.on'); if (on && !coarse) on.scrollIntoView({block: 'nearest'});
  const filled = [...SOL.keys()].filter(k => P.vals[k]).length; $('prog').textContent = '✏️ ' + filled + ' / ' + SOL.size + ' lettres · ' + P.words.filter(wordDone).length + ' / ' + P.words.length + ' mots';
  $('timeTxt').textContent = '⏱ ' + fmtTime(P.time);
  const s = ls.get('arc_cw', {}); $('stats').innerHTML = s.solved ? '<b>' + s.solved + '</b> grille' + (s.solved > 1 ? 's' : '') + ' résolue' + (s.solved > 1 ? 's' : '') + (s.best ? ' · record ' + fmtTime(s.best) + ' (sans aide)' : '') : 'Résous ta première grille !';
}
function select(w){ cur = {r: w.r, c: w.col, dir: w.dir}; const e = cellsOf(w).find(([r, c]) => !P.vals[K(r, c)]); if (e) { cur.r = e[0]; cur.c = e[1]; } draw(); focusKb(); }
function focusKb(){ if (coarse && !done) { kb.value = ' '; kb.focus({preventScroll: true}); setTimeout(() => { const c = document.querySelector('.cw .k.cur'); if (c) c.scrollIntoView({block: 'center', behavior: 'smooth'}); }, 350); } }
function step(d){ const w = curWord(); if (!w) return; const cs = cellsOf(w), i = cs.findIndex(([r, c]) => r === cur.r && c === cur.c), j = i + d; if (j >= 0 && j < cs.length) { cur.r = cs[j][0]; cur.c = cs[j][1]; } }
function type(ch){
  if (done) return; const k = K(cur.r, cur.c); if (!SOL.has(k)) return;
  if (!P.rev[k]) { P.vals[k] = ch; bad.delete(k); }
  tone(600 + (ch.charCodeAt(0) - 65) * 12, 0, .05, 'sine', .05);
  const w = curWord(); step(1); save(); draw(); if (w && wordDone(w)) sfx.ok(); win();
}
function back(){ if (done) return; const k = K(cur.r, cur.c); if (P.vals[k] && !P.rev[k]) { delete P.vals[k]; bad.delete(k); } else { step(-1); const k2 = K(cur.r, cur.c); if (!P.rev[k2]) { delete P.vals[k2]; bad.delete(k2); } } save(); draw(); }
function cycle(d){ const ws = P.words.slice().sort((a, b) => (a.dir === b.dir ? a.num - b.num : a.dir === 'a' ? -1 : 1)), i = ws.indexOf(curWord()); select(ws[(i + d + ws.length) % ws.length]); sfx.click(); }
function win(){
  if (done || [...SOL.entries()].some(([k, e]) => P.vals[k] !== e.ch)) return;
  done = true; try { localStorage.removeItem('arc_cw_save'); } catch(e) {} kb.blur();
  let rec = false; stat('arc_cw', s => { s.solved = (s.solved | 0) + 1; if (!P.reveals && (!s.best || P.time < s.best)) { s.best = P.time; rec = true; } });
  sfx.win(); draw();
  setTimeout(() => modal('Grille terminée ! 🎉', '<p class="note">' + P.words.length + ' mots en <b>' + fmtTime(P.time) + '</b>' + (P.reveals ? ', avec ' + P.reveals + ' aide' + (P.reveals > 1 ? 's' : '') + ' (pas de record avec aide)' : ', sans aide') + '.' + (rec ? '<br><b style="color:var(--gold)">★ Nouveau record !</b>' : '') + '</p>', [['Nouvelle grille', newGame], ['Fermer', null, true]]), 450);
}
$('cw').addEventListener('click', e => {
  const b = e.target.closest('.k'); if (!b) return; const [r, c] = b.dataset.k.split(',').map(Number);
  if (r === cur.r && c === cur.c) { const o = cur.dir === 'a' ? 'd' : 'a'; if (wordAt(r, c, o)) cur.dir = o; }
  else { cur.r = r; cur.c = c; if (!wordAt(r, c, cur.dir)) cur.dir = cur.dir === 'a' ? 'd' : 'a'; }
  sfx.click(); draw(); focusKb();
});
$('la').parentElement.parentElement.addEventListener('click', e => { const li = e.target.closest('li[data-w]'); if (li) select(P.words[+li.dataset.w]); });
$('prevW').onclick = () => cycle(-1); $('nextW').onclick = () => cycle(1);
$('checkBtn').onclick = () => { bad = new Set([...SOL.entries()].filter(([k, e]) => P.vals[k] && P.vals[k] !== e.ch).map(([k]) => k)); P.checks++; draw(); if (bad.size) { sfx.bad(); toast(bad.size + ' lettre' + (bad.size > 1 ? 's' : '') + ' fausse' + (bad.size > 1 ? 's' : '') + ', en rouge.'); } else { sfx.ok(); toast('Tout est juste pour l\'instant !'); } };
$('revL').onclick = () => { const k = K(cur.r, cur.c), e = SOL.get(k); if (!e || done || P.vals[k] === e.ch) return; P.vals[k] = e.ch; P.rev[k] = 1; bad.delete(k); P.reveals++; step(1); sfx.click(); save(); draw(); win(); };
$('revW').onclick = () => { const w = curWord(); if (!w || done || wordDone(w)) return; cellsOf(w).forEach(([r, c]) => { const k = K(r, c); if (P.vals[k] !== SOL.get(k).ch) { P.vals[k] = SOL.get(k).ch; P.rev[k] = 1; bad.delete(k); } }); P.reveals++; sfx.ok(); save(); draw(); win(); };
$('newBtn').onclick = () => { if (!done && Object.keys(P.vals).length) modal('Nouvelle grille ?', '<p class="note">La grille en cours sera perdue.</p>', [['Oui', newGame], ['Continuer', null, true]]); else newGame(); };
const norm1 = ch => ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
kb.addEventListener('input', () => { const v = kb.value; if (v.length < 1) back(); else { const ch = norm1(v.slice(-1)); if (/^[A-Z]$/.test(ch)) type(ch); } kb.value = ' '; });
addEventListener('keydown', e => {
  if ($('modal') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target === kb) { if (e.key === 'Enter') { e.preventDefault(); cycle(1); } return; }
  const ch = e.key.length === 1 ? norm1(e.key) : '';
  if (/^[A-Z]$/.test(ch)) { e.preventDefault(); type(ch); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); back(); }
  else if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); cycle(e.shiftKey ? -1 : 1); }
  else if (e.key.startsWith('Arrow')) {
    e.preventDefault(); const d = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]}[e.key], dir = d[0] ? 'd' : 'a';
    if (cur.dir !== dir && wordAt(cur.r, cur.c, dir)) { cur.dir = dir; draw(); return; }
    let r = cur.r + d[0], c = cur.c + d[1]; while (r >= 0 && c >= 0 && r < P.H && c < P.W && !SOL.has(K(r, c))) { r += d[0]; c += d[1]; }
    if (SOL.has(K(r, c))) { cur.r = r; cur.c = c; if (!wordAt(r, c, cur.dir)) cur.dir = cur.dir === 'a' ? 'd' : 'a'; draw(); }
  }
});
addEventListener('resize', () => P && draw());
setInterval(() => { if (P && !done && !document.hidden && !$('modal')) { P.time++; $('timeTxt').textContent = '⏱ ' + fmtTime(P.time); if (P.time % 5 === 0) save(); } }, 1000);
const sv = ls.get('arc_cw_save', null);
if (sv && Array.isArray(sv.words) && sv.words.length) { P = sv; P.rev = P.rev || {}; index(); const w = P.words[0]; cur = {r: w.r, c: w.col, dir: w.dir}; draw(); toast('Grille en cours reprise.'); } else newGame();
</script>
