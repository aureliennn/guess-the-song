=='SCRIPT'||(g.tagName==='LINK'&&(g.href||'').indexOf(location.origin)===0)))show('Fichier introuvable : '+(g.src||g.href||'').split('/').pop());else if(e.message&&!/: 3d$/.test(e.message))show(e.message)},true)})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Arcade Néon</title>
<meta name="theme-color" content="#07040f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="arcade.css">
<style>
.box{padding:16px;border-radius:18px;display:grid;gap:10px;max-width:520px;margin:0 auto 12px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:18px;outline:0;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.uid{font-family:monospace;font-size:13px;word-break:break-all;padding:10px;border-radius:10px;background:rgba(255,255,255,.07);user-select:all;-webkit-user-select:all}
.res{font-size:14px;line-height:1.5}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="./">← Arcade</a><h1>🔑 Admin</h1></div>
  <div id="app" class="note">Connexion…</div>
</div>
<script src="arcade.js"></script>
<script src="fbauth.js"></script>
<script>
const DB = 'https://guess-the-song-27134-default-rtdb.europe-west1.firebasedatabase.app';
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
let UID = '';
const get = async p => { const t = await FBA.token(); const r = await fetch(DB + p + '.json?auth=' + encodeURIComponent(t)); if (!r.ok) throw new Error(r.status); return r.json(); };
async function init(){
  UID = await FBA.ready(); const admin = await FBA.isAdmin();
  if (!admin) {
    $('app').innerHTML = '<div class="box glass"><h3>🔑 Connexion admin</h3><p class="note">Réservé à l\'administrateur du site. Ton mot de passe est vérifié directement par Google (Firebase) : le site ne le voit ni ne le garde.</p>' +
      '<input class="inp" id="em" type="email" autocomplete="username" placeholder="E-mail admin" style="text-transform:none;letter-spacing:0">' +
      '<input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" style="text-transform:none;letter-spacing:0">' +
      '<button class="btn" id="login" type="button">Se connecter</button><p class="note" id="lmsg"></p>' +
      (FBA.email() ? '<p class="note">Connecté avec ' + esc(FBA.email()) + ', mais ce compte n\'est pas admin. <button class="btn ghost sm" id="out" type="button">Se déconnecter</button></p>' : '') + '</div>' +
      '<div class="box glass"><h3>📱 Identifiant de cet appareil</h3><p class="note">Ouvre cette page <b>dans l\'appli où tu joues</b> (Safari ou l\'icône sur ton écran d\'accueil, ce sont deux appareils différents), puis envoie cet identifiant au développeur pour rendre cet appareil admin. Ce n\'est pas un secret.</p><div class="uid">' + esc(UID) + '</div><button class="btn sm" id="cp" type="button">📋 Copier l\'identifiant</button></div>';
    const go = async () => { const em = $('em').value.trim(), pw = $('pw').value; if (!em || !pw) { $('lmsg').textContent = 'Entre ton e-mail et ton mot de passe.'; return; }
      $('lmsg').textContent = 'Connexion…'; try { await FBA.signIn(em, pw); $('pw').value = ''; if (await FBA.isAdmin()) { sfx.win(); toast('🛡️ Connecté en admin'); init(); } else { $('lmsg').textContent = 'Connecté, mais ce compte n\'est pas dans la liste des admins.'; init(); } }
      catch(e) { $('pw').value = ''; $('lmsg').textContent = /INVALID|PASSWORD|EMAIL_NOT_FOUND|CREDENTIAL/i.test(e.code || '') ? 'E-mail ou mot de passe incorrect.' : /TOO_MANY/i.test(e.code || '') ? 'Trop d\'essais : réessaie dans quelques minutes.' : /OPERATION_NOT_ALLOWED/i.test(e.code || '') ? 'La connexion par e-mail n\'est pas encore activée dans Firebase.' : 'Connexion impossible, réessaie.'; } };
    $('login').onclick = go; $('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
    if ($('out')) $('out').onclick = async () => { await FBA.signOut(); init(); };
    $('cp').onclick = async () => { try { await navigator.clipboard.writeText(UID); toast('Copié !'); } catch(e) { toast(UID); } };
    return;
  }
  $('app').innerHTML = '<div class="box glass"><p class="note">🛡️ Connecté en admin' + (FBA.email() ? ' : <b style="color:var(--txt)">' + esc(FBA.email()) + '</b>' : '') + '. Ton badge ADMIN est visible par tous dans le Monde Néon.</p><div class="row"><a class="btn ghost sm" href="monde.html">🌐 Aller dans le monde</a>' + (FBA.email() ? '<button class="btn ghost sm" id="out" type="button">Se déconnecter</button>' : '') + '</div></div>' +
    '<div class="box glass"><h3>💳 Paiements à vérifier</h3><p class="note">Les joueurs qui ont appuyé sur « J\'ai payé ». Vérifie dans PayPal que tu as bien reçu 2,99 € avec ce code dans le message, puis active.</p><div id="reqs" class="note">Chargement…</div></div>' +
    '<div class="box glass"><h3>✅ Activer un Pass premium</h3><p class="note">Quand tu reçois un paiement (PayPal), copie le code de 12 caractères écrit dans le message, puis colle-le ici.</p>' +
    '<input class="inp" id="code" maxlength="16" placeholder="XXXX-XXXX-XXXX" autocomplete="off"><div class="row"><button class="btn" id="chk" type="button">Vérifier</button><button class="btn" id="act" type="button">⭐ Activer le pass</button></div><div class="res" id="res"></div></div>' +
    '<div class="box glass"><h3>Passes activés</h3><div id="list" class="note">Chargement…</div></div>' +
    '<div class="box glass"><h3>🛡️ Modération du Monde Néon</h3><div class="row"><button class="btn ghost sm" id="clrChat" type="button">🧹 Vider le chat</button></div><div id="plist" class="note" style="margin-top:8px">Chargement…</div></div>' +
    '<div class="box glass"><p class="note">Remboursement : vérifie le code puis appuie sur « Retirer le pass ». N\'active un pass qu\'après avoir vu le paiement arriver sur ton compte PayPal.</p></div>';
  $('chk').onclick = check; $('act').onclick = activate; list(); reqs(); players(); $('clrChat').onclick = clearChat; clearInterval(window.__iv); window.__iv = setInterval(() => { reqs(); players(); }, 15000);
  if ($('out')) $('out').onclick = async () => { await FBA.signOut(); toast('Déconnecté'); init(); };
}
async function reqs(){
  try { const d = await get('/payreq') || {}; const e = Object.entries(d).sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
    $('reqs').innerHTML = e.length ? e.map(([k, v]) => '<div class="li" style="flex-wrap:wrap;align-items:center"><span><b>' + k.replace(/(.{4})(?=.)/g, '$1-') + '</b><br>' + esc(v.n || 'sans pseudo') + ' · ' + ((v.a | 0) / 100).toFixed(2).replace('.', ',') + ' € · ' + new Date(v.t || 0).toLocaleString('fr-FR') + '</span><span class="row"><button class="btn sm" data-ok="' + k + '" type="button">⭐ Activer</button><button class="btn ghost sm" data-no="' + k + '" type="button">Refuser</button></span></div>').join('') : 'Aucune demande en attente. 🎉';
    document.title = (e.length ? '(' + e.length + ') ' : '') + 'Admin — Arcade Néon';
  } catch(x) { $('reqs').textContent = 'Liste indisponible.'; }
}
async function players(){
  try { const d = (await (await fetch(DB + '/world/players.json')).json()) || {}; const now = Date.now(), e = Object.entries(d).filter(([k, v]) => v && now - (v.t || 0) < 120000);
    $('plist').innerHTML = e.length ? '<b>Joueurs en ligne :</b>' + e.map(([k, v]) => '<div class="li"><span>' + (v.adm ? '🛡️ ' : '') + esc(String(v.n || '?').slice(0, 16)) + '</span><button class="btn ghost sm" data-kick="' + k + '" type="button">Retirer</button></div>').join('') : 'Personne dans le monde en ce moment.';
  } catch(x) { $('plist').textContent = 'Liste indisponible.'; }
}
const adminWrite = async (path, method, body) => { const t = await FBA.token(); return fetch(DB + path + '.json?auth=' + encodeURIComponent(t), {method, body: body === undefined ? undefined : JSON.stringify(body)}); };
async function clearChat(){ if (!confirm('Effacer tous les messages du chat ?')) return; const r = await adminWrite('/world/chat', 'DELETE'); toast(r.ok ? '🧹 Chat vidé' : 'Refusé'); }
document.addEventListener('click', async e => {
  const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]'), kick = e.target.closest('[data-kick]');
  if (ok) { const code = ok.dataset.ok; if (!confirm('As-tu bien reçu le paiement PayPal avec le code ' + code + ' ?')) return;
    const r = await adminWrite('/', 'PATCH', {['premium/' + code]: {season: 's1', t: {'.sv': 'timestamp'}, by: UID}, ['payreq/' + code]: null}); toast(r.ok ? '⭐ Pass activé !' : 'Refusé par la base'); if (r.ok) sfx.win(); reqs(); list(); }
  if (no) { if (!confirm('Refuser cette demande (paiement non reçu) ?')) return; const r = await adminWrite('/payreq/' + no.dataset.no, 'DELETE'); toast(r.ok ? 'Demande refusée' : 'Refusé'); reqs(); }
  if (kick) { if (!confirm('Retirer ce joueur du monde ?')) return; const r = await adminWrite('/world/players/' + kick.dataset.kick, 'DELETE'); toast(r.ok ? 'Joueur retiré' : 'Refusé'); players(); }
});
async function check(){
  const code = norm($('code').value); if (!/^[A-Z2-9]{12}$/.test(code)) { $('res').textContent = 'Code invalide : il faut 12 caractères.'; return null; }
  const [save, prem] = await Promise.all([fetch(DB + '/save/' + code + '.json').then(r => r.json()).catch(() => null), get('/premium/' + code).catch(() => null)]);
  $('res').innerHTML = save ? '👤 Joueur : <b>' + esc(save.n || 'sans pseudo') + '</b> · 💠 ' + (save.j | 0) + ' · niveau ' + Math.min(30, Math.floor((save.xp | 0) / 100)) + '<br>' + (prem ? '⭐ Pass déjà activé le ' + new Date(prem.t).toLocaleString('fr-FR') + ' <button class="btn ghost sm" id="del" type="button">Retirer le pass</button>' : 'Pass non activé.') : '⚠️ Aucune sauvegarde avec ce code : vérifie qu\'il est bien recopié.';
  if (prem && $('del')) $('del').onclick = () => remove(code);
  return {code, save, prem};
}
async function activate(){
  const r = await check(); if (!r) return; if (!r.save) { toast('Code inconnu : rien n\'a été activé.'); return; } if (r.prem) { toast('Déjà activé.'); return; }
  if (!confirm('As-tu bien reçu le paiement pour ce code ? Activer le pass ?')) return;
  const t = await FBA.token(), res = await fetch(DB + '/premium/' + r.code + '.json?auth=' + encodeURIComponent(t), {method: 'PUT', body: JSON.stringify({season: 's1', t: {'.sv': 'timestamp'}, by: UID})});
  if (res.ok) { sfx.win(); toast('⭐ Pass activé ! Le joueur le verra à sa prochaine visite.'); check(); list(); } else toast('Refusé par la base (droits admin ?).');
}
async function remove(code){ if (!confirm('Retirer le pass de ' + code + ' (remboursement) ?')) return; const t = await FBA.token(); const r = await fetch(DB + '/premium/' + code + '.json?auth=' + encodeURIComponent(t), {method: 'DELETE'}); toast(r.ok ? 'Pass retiré.' : 'Refusé.'); check(); list(); }
async function list(){ try { const d = await get('/premium') || {}; const e = Object.entries(d).sort((a, b) => (b[1].t || 0) - (a[1].t || 0)); $('list').innerHTML = e.length ? e.slice(0, 50).map(([k, v]) => '<div class="li"><span>' + k.replace(/(.{4})(?=.)/g, '$1-') + '</span><span>' + new Date(v.t || 0).toLocaleDateString('fr-FR') + '</span></div>').join('') : 'Aucun pass activé pour l\'instant.'; } catch(e) { $('list').textContent = 'Liste indisponible.'; } }
init().catch(() => { $('app').textContent = 'Connexion impossible, réessaie.'; });
</script>
</body>
</html>
