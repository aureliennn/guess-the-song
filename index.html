<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Nations Cup 3D : un vrai match de foot en 3D dans ton navigateur. Entraînement, phase de groupes, demi-finale et finale.">
<title>Nations Cup 3D — Match complet</title>
<style>
  :root { --bg:#070c1a; --panel:rgba(14,22,42,.93); --line:#27365a; --ink:#f2f5fa; --mute:#9fb0c8; --accent:#ffd23f; --good:#4be37a; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
               font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; -webkit-user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  kbd { background:#26334f; border-radius:5px; padding:1px 7px; font-family:inherit; color:var(--accent); font-weight:700; }
  .hud { position:fixed; pointer-events:none; z-index:2; }
  #brand { top:12px; left:14px; font-weight:800; font-size:18px; letter-spacing:.5px; text-shadow:0 2px 6px #000; }
  #brand span { color:var(--accent); }
  #topbtn { position:fixed; top:10px; right:12px; z-index:6; display:flex; gap:6px; }
  #topbtn button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:13px; cursor:pointer; font-family:inherit; }
  #score, #tutoBox { top:10px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:14px; text-align:center; }
  #score { padding:7px 18px 8px; min-width:min(92vw,460px); }
  #score .stage, #tutoBox .st { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
  #score .row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-top:3px; }
  #score .t { display:flex; align-items:center; gap:7px; font-weight:700; font-size:clamp(13px,2.2vw,17px); }
  #score .t.l { justify-content:flex-end; }
  #score .n { font-size:clamp(20px,3.4vw,28px); font-weight:800; color:var(--accent); white-space:nowrap; }
  #score .clock { font-size:13px; color:var(--mute); font-weight:700; margin-top:2px; }
  #tutoBox { border:2px solid var(--accent); padding:10px 18px; width:min(94vw,640px); pointer-events:auto; font-size:clamp(13px,2vw,16px); line-height:1.7; }
  #tutoBox button { margin-top:6px; background:none; border:1px solid var(--line); color:var(--mute); border-radius:8px; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:12px; }
  .flag { width:30px; height:20px; border-radius:3px; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,.25); display:inline-block; vertical-align:middle; }
  #msg { top:40%; left:50%; transform:translate(-50%,-50%); text-align:center; width:96vw; }
  #msg b { display:block; font-size:clamp(34px,8vw,84px); font-weight:900; letter-spacing:1px;
           text-shadow:0 4px 0 rgba(0,0,0,.45), 0 0 30px rgba(0,0,0,.6); animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  #msg small { display:block; font-size:clamp(16px,3vw,28px); font-weight:700; text-shadow:0 2px 8px #000; margin-top:4px; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
  #hint { bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--panel);
          border:1px solid var(--line); border-radius:999px; padding:8px 18px; font-size:clamp(11px,1.8vw,14px); font-weight:600;
          white-space:nowrap; max-width:96vw; overflow:hidden; text-overflow:ellipsis; }
  #power { bottom:calc(60px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:min(60vw,300px); height:18px;
           border-radius:999px; border:2px solid #fff; background:rgba(0,0,0,.5); overflow:hidden; }
  #power i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4be37a,#ffd23f 60%,#ff5a5a); }
  #map { top:86px; right:12px; width:150px; height:100px; border-radius:8px; border:1px solid var(--line); opacity:.9; }
  .hide { display:none !important; }
  #touch { position:fixed; inset:auto 0 0 0; height:210px; z-index:4; pointer-events:none; }
  #joy { position:absolute; left:22px; bottom:26px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.12);
         border:2px solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; }
  #joy i { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px; border-radius:50%; background:rgba(255,255,255,.55); }
  .tb { position:absolute; bottom:30px; width:78px; height:78px; border-radius:50%; border:2px solid rgba(255,255,255,.5); color:#fff;
        font-weight:800; font-size:12px; pointer-events:auto; touch-action:none; font-family:inherit; }
  #bPass { right:112px; background:rgba(75,227,122,.45); } #bShoot { right:22px; bottom:74px; background:rgba(255,90,90,.5); }
  #bLob { right:118px; bottom:122px; width:62px; height:62px; background:rgba(255,210,63,.45); }

  #overlay { position:fixed; inset:0; z-index:5; overflow:auto; display:flex; }
  #overlay.menu { background:linear-gradient(90deg, rgba(7,12,26,.95) 0, rgba(7,12,26,.9) 50%, rgba(7,12,26,0) 78%); }
  #overlay.end { background:rgba(7,12,26,.82); align-items:center; justify-content:center; padding:16px; }
  .left { width:min(100%,640px); padding:54px 22px 22px 26px; }
  .left h2 { margin:0; font-size:clamp(24px,3.6vw,38px); }
  .left p { margin:4px 0 14px; color:var(--mute); font-size:14px; }
  .teams { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .team { display:flex; flex-direction:column; align-items:center; gap:6px; background:rgba(20,30,56,.9); color:var(--ink);
          border:2px solid var(--line); border-radius:12px; padding:10px 4px 8px; font-size:13px; font-weight:600; cursor:pointer;
          font-family:inherit; transition:transform .12s, border-color .12s; }
  .team .flag { width:48px; height:32px; }
  .team:hover { transform:translateY(-2px); border-color:#5b74ad; }
  .team.sel { border-color:var(--accent); background:rgba(60,52,14,.9); }
  .seg { display:inline-flex; margin-top:6px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { background:rgba(20,30,56,.9); color:var(--mute); border:0; padding:9px 16px; font-size:14px; cursor:pointer; font-family:inherit; font-weight:600; }
  .seg button.on { background:var(--accent); color:#1a1300; }
  .lab { color:var(--mute); font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:14px 0 0; }
  .keys { color:var(--mute); font-size:13px; line-height:2; margin-top:6px; text-align:left; }
  .keys b { color:var(--ink); }
  .links { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .links button, .links a { background:rgba(20,30,56,.9); border:1px solid var(--line); color:var(--accent); border-radius:9px; padding:7px 12px; font-size:13px;
                            cursor:pointer; font-family:inherit; text-decoration:none; font-weight:600; }
  .right { flex:1; display:flex; align-items:flex-end; justify-content:center; padding:20px; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 20px; width:min(100%,330px); }
  .card .head { display:flex; align-items:center; gap:12px; font-size:24px; font-weight:800; }
  .card .head .flag { width:54px; height:36px; }
  .stat { display:grid; grid-template-columns:78px 1fr; align-items:center; gap:10px; margin-top:10px; font-size:13px; color:var(--mute); }
  .pips { display:flex; gap:4px; } .pips i { flex:1; height:8px; border-radius:4px; background:#26334f; } .pips i.on { background:var(--accent); }
  .btn { background:var(--accent); color:#1a1300; border:0; border-radius:12px; padding:13px 28px; font-size:18px; font-weight:800;
         cursor:pointer; font-family:inherit; margin-top:16px; width:100%; }
  .btn:hover { filter:brightness(1.1); }
  .btn.alt { background:none; color:var(--mute); border:1px solid var(--line); font-size:14px; padding:9px; margin-top:8px; }
  .tro { color:var(--accent); font-weight:700; font-size:14px; margin-top:10px; text-align:center; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px 28px; width:min(100%,480px); text-align:center; }
  .panel h2 { margin:0 0 4px; font-size:clamp(26px,5vw,40px); }
  .panel p { margin:0 0 12px; color:var(--mute); }
  .panel .big { font-size:64px; line-height:1; }
  table.grp { width:100%; border-collapse:collapse; font-size:14px; margin-bottom:8px; }
  table.grp th { color:var(--mute); font-size:11px; font-weight:600; text-transform:uppercase; padding:4px 6px; }
  table.grp td { padding:7px 6px; background:rgba(20,30,56,.9); border-top:3px solid var(--bg); }
  table.grp td:nth-child(2) { text-align:left; } table.grp td .flag { margin-right:8px; }
  table.grp tr.q td:first-child { box-shadow:inset 3px 0 0 var(--good); } table.grp tr.me td { background:rgba(60,52,14,.95); font-weight:700; }
  .oth { font-size:13px; margin:4px 0 !important; }
  .confetti { position:fixed; top:-20px; width:10px; height:16px; z-index:7; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (max-width:820px) {
    #overlay.menu { flex-direction:column; background:rgba(7,12,26,.9); }
    .left { width:100%; padding:50px 14px 6px; } .right { padding:8px 14px 20px; flex:none; }
    .card { width:100%; } #brand { font-size:15px; } #score, #tutoBox { top:48px; } #map { top:132px; width:105px; height:70px; }
  }
  @media (max-width:480px) { .teams { gap:5px; } .team { font-size:10px; padding:7px 2px 6px; } .team .flag { width:36px; height:24px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brand" class="hud">⚽ NATIONS <span>CUP</span> 3D</div>
<div id="topbtn"><button id="pause" class="hide">⏸ Pause</button><button id="mute">🔊 Son</button></div>
<div id="score" class="hud hide"></div>
<div id="tutoBox" class="hud hide"></div>
<canvas id="map" class="hud hide" width="150" height="100"></canvas>
<div id="msg" class="hud hide"></div>
<div id="power" class="hud hide"><i></i></div>
<div id="hint" class="hud hide"></div>
<div id="touch" class="hide"><div id="joy"><i></i></div><button id="bLob" class="tb">LONG</button><button id="bPass" class="tb">PASSE</button><button id="bShoot" class="tb">TIR</button></div>
<div id="overlay" class="end"><div class="panel"><h2>Chargement du stade…</h2><p>Préparation des joueurs 3D</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(() => {
'use strict';
const T = THREE, $ = id => document.getElementById(id);
const cv = $('c'), ov = $('overlay'), elScore = $('score'), elMsg = $('msg'), elHint = $('hint'), elPower = $('power'), elMap = $('map'), elTuto = $('tutoBox');
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b, v)), lerp = (a,b,t) => a + (b-a)*t;
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Xbot.glb';
const coarse = matchMedia('(pointer:coarse)').matches;

/* ================= Données ================= */
const L = 32, Wd = 21, GZ = 3.2, GH = 2.3, BR = .2, HALF = 100;
const v3 = (a,b,c) => `<rect width="10" height="20" fill="${a}"/><rect x="10" width="10" height="20" fill="${b}"/><rect x="20" width="10" height="20" fill="${c}"/>`;
const h3 = (a,b,c) => `<rect width="30" height="6.7" fill="${a}"/><rect y="6.7" width="30" height="6.7" fill="${b}"/><rect y="13.3" width="30" height="6.7" fill="${c}"/>`;
const star = (cx,cy,r,f) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, q = i%2 ? r*.4 : r; p += `${(cx+Math.cos(a)*q).toFixed(2)},${(cy+Math.sin(a)*q).toFixed(2)} `; } return `<polygon points="${p}" fill="${f}"/>`; };
const TEAMS = [
  ['France','#1f3fa8','#ffffff','#c8102e',5,4, v3('#0055A4','#fff','#EF4135')],
  ['Brésil','#f7d417','#1f4fb0','#ffffff',5,4, `<rect width="30" height="20" fill="#009739"/><polygon points="15,2.5 27,10 15,17.5 3,10" fill="#FEDD00"/><circle cx="15" cy="10" r="4.2" fill="#012169"/>`],
  ['Argentine','#8fd0f5','#111111','#ffffff',5,4, h3('#74ACDF','#fff','#74ACDF') + `<circle cx="15" cy="10" r="2" fill="#F6B40E"/>`],
  ['Allemagne','#f4f4f4','#111111','#ffffff',4,5, h3('#000','#DD0000','#FFCE00')],
  ['Espagne','#c8102e','#14237a','#14237a',5,4, `<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>`],
  ['Italie','#1e63c8','#ffffff','#1e63c8',4,5, v3('#009246','#fff','#CE2B37')],
  ['Angleterre','#ffffff','#14237a','#ffffff',4,4, `<rect width="30" height="20" fill="#fff"/><rect x="13" width="4" height="20" fill="#CE1124"/><rect y="8" width="30" height="4" fill="#CE1124"/>`],
  ['Portugal','#b0122a','#0b6b3a','#0b6b3a',5,3, `<rect width="30" height="20" fill="#DA291C"/><rect width="12" height="20" fill="#046A38"/><circle cx="12" cy="10" r="3.4" fill="#FFE900"/>`],
  ['Pays-Bas','#f36c21','#ffffff','#f36c21',4,4, h3('#AE1C28','#fff','#21468B')],
  ['Belgique','#d71920','#111111','#d71920',4,4, v3('#000','#FDDA24','#EF3340')],
  ['Maroc','#c1272d','#0b6b3a','#c1272d',3,5, `<rect width="30" height="20" fill="#C1272D"/>` + star(15,10.4,4.6,'#006233')],
  ['Japon','#14237a','#ffffff','#14237a',3,4, `<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#BC002D"/>`],
  ['Sénégal','#ffffff','#0b8a45','#ffffff',4,3, v3('#00853F','#FDEF42','#E31B23') + star(15,10.3,2.8,'#00853F')],
  ['Croatie','#e8112d','#ffffff','#14237a',4,4, h3('#FF0000','#fff','#171796') + `<rect x="12.5" y="6" width="5" height="6" fill="#FF0000"/><rect x="12.5" y="6" width="2.5" height="3" fill="#fff"/><rect x="15" y="9" width="2.5" height="3" fill="#fff"/>`],
  ['Uruguay','#6fb7e9','#111111','#111111',4,3, `<rect width="30" height="20" fill="#fff"/><rect y="4.4" width="30" height="2.2" fill="#0038A8"/><rect y="8.9" width="30" height="2.2" fill="#0038A8"/><rect y="13.3" width="30" height="2.2" fill="#0038A8"/><rect y="17.8" width="30" height="2.2" fill="#0038A8"/><rect width="11" height="11" fill="#fff"/><circle cx="5.5" cy="5.5" r="2.8" fill="#FCD116"/>`],
  ['Mexique','#0b6b3a','#ffffff','#c8102e',3,4, v3('#006847','#fff','#CE1126') + `<circle cx="15" cy="10" r="2" fill="#8a5a2b"/>`]
].map(([name,c1,c2,c3,att,def,svg]) => ({ name, c1, c2, c3, att, def, flag:`<svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="none">${svg}</svg>` }));
// Postes (pour une équipe qui attaque vers +x) : gardien, 2 défenseurs, 3 milieux, 1 attaquant
const HOME = [[-L + 1.2, 0], [-19, -8], [-19, 8], [-7, -13], [-5, 0], [-7, 13], [7, 0]];
const SKINS = ['#e0ac84', '#c98f66', '#8d5a3b', '#f0c8a8'];
const REFKIT = { shirt:'#f4e409', shorts:'#15181f', socks:'#15181f', skin:'#d9a47c', hair:'#3a2a1a' };
const CONTROLS = `<div class="keys"><b>Se déplacer</b> <kbd>ZQSD</kbd> ou <kbd>flèches</kbd> · <b>Sprint</b> <kbd>Maj</kbd> ou <kbd>L</kbd><br>
  <b>Avec le ballon</b> — <kbd>Espace</kbd>/<kbd>J</kbd> tir (maintenir = puissance) · <kbd>E</kbd>/<kbd>K</kbd> passe · <kbd>F</kbd>/<kbd>I</kbd> passe longue<br>
  <b>Sans le ballon</b> — <kbd>Espace</kbd>/<kbd>J</kbd> tacle · <kbd>E</kbd>/<kbd>K</kbd> changer de joueur<br>
  <kbd>P</kbd> pause · <kbd>C</kbd> caméra · <b>Manette</b> : stick, A passe, X tir, Y longue, RT sprint</div>`;

/* ================= Son (entièrement synthétisé, donc libre de droits) ================= */
let AC = null, master = null, crowdGain = null, muted = false;
function noiseBuf(sec){ const b = AC.createBuffer(1, AC.sampleRate*sec, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1; return b; }
function audioOn(){
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
      // Foule : trois couches de bruit filtré, avec une houle lente
      crowdGain = AC.createGain(); crowdGain.gain.value = .5; crowdGain.connect(master);
      [[380, .5, .16], [900, .7, .09], [2200, .9, .03]].forEach(([f, q, v], i) => { const s = AC.createBufferSource(); s.buffer = noiseBuf(4 + i); s.loop = true;
        const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; const g = AC.createGain(); g.gain.value = v;
        const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .09 + i*.07; lg.gain.value = v*.45; lfo.connect(lg); lg.connect(g.gain); lfo.start();
        s.connect(bp); bp.connect(g); g.connect(crowdGain); s.start(); });
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function excite(v){ if (AC && crowdGain) crowdGain.gain.setTargetAtTime(v, AC.currentTime, .5); }
function sNoise(dur, freq, vol, attack, delay, f2){
  if (!AC) return; const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(); s.buffer = noiseBuf(dur);
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur*.6); f.Q.value = .7;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t+attack); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function sTone(f1, f2, dur, vol, type, delay){
  if (!AC) return; const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur);
}
const sfx = {
  kick: v => { v = v || .5; sTone(190, 42, .13, .3 + .6*v); sNoise(.05, 2600, .18 + .25*v, .003); },
  bounce: () => sTone(120, 60, .07, .14),
  tackle: () => { sNoise(.14, 420, .5, .008); sTone(95, 50, .1, .3); },
  net: () => sNoise(.4, 3200, .22, .02, 0, 1800),
  click: () => sTone(600, 800, .06, .15), ok: () => { sTone(660, 660, .09, .16); sTone(990, 990, .14, .16, 'sine', .09); },
  // Sifflet d'arbitre : deux notes aiguës avec une roulette rapide
  whistle(n, long){ if (!AC) return; n = n || 1;
    for (let i = 0; i < n; i++) { const t = AC.currentTime + i*.3, dur = long && i === n - 1 ? .85 : .2;
      const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .015); g.gain.setValueAtTime(.08, t + dur - .04); g.gain.linearRampToValueAtTime(0, t + dur);
      const trem = AC.createGain(); trem.gain.value = .6; const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 44; lg.gain.value = .4; lfo.connect(lg); lg.connect(trem.gain);
      [2380, 2860].forEach(f => { const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(trem); o.start(t); o.stop(t + dur); });

}

    return `<tr class="${t === me ? 'me' : ''}${i < 2 ? ' q' : ''}"><td>${i + 1}</td><td>${t.flag}${t.name}</td><td>${r.j}</td><td>${r.gf}:${r.ga}</td><td><b>${r.p}</b></td></tr>`; }).join('') + '</table>';

  if (!cur.ko) {

    return showPanel('', 'Éliminé…', `${res}. ${me.name} termine ${rank + 1}e du groupe.`, 'Retour au menu', showMenu, true);
  }

  else if (win) showPanel('', 'En finale !', res, 'Finale ▶', nextMatch, true);

function gkTarget(p, sp){

  const free = !ball.owner;
  if (free && ball.vx*tm.dir < -4) { const tHit = (gx - ball.x)/ball.vx;
    if (tHit > 0 && tHit < 1.7) { const zi = ball.z + ball.vz*tHit; if (Math.abs(zi) < GZ + 1.5) { p.save = true; return [gx + tm.dir*.7, clamp(zi, -GZ, GZ), sp*1.25]; } } }

function target(p){

  if (p.stun > 0) return [p.x, p.z, 0];
  if (p.isGK) return gkTarget(p, (tm.human ? 6.6 - diff*.3 : 5.8 + diff*.5) + (tm.team.def - 4)*.3);
  if (own === p) return [p.x + p.ix*5, p.z + p.iz*5, ai*.93];
  if (tm.passTarget === p && !own) return [ball.x + ball.vx*.25, ball.z + ball.vz*.25, ai*1.05];

    const press = (p === tm.chase[0] ? !tm.human : p === tm.chase[1] && (ball.x*tm.dir < 2 || !tm.human && diff > 0))
      || (p !== ctrl && p.j < 3 && own && Math.hypot(own.x - p.x, own.z - p.z) < 8 && ball.x*tm.dir < -6);
    if (press || (tm.human && !own && p === tm.chase[0] && p !== ctrl)) return own ? [own.x + own.vx*.3, own.z + own.vz*.3, ai] : [ball.x + ball.vx*.3, ball.z + ball.vz*.3, ai];
  }
  const att = own ? (own.tm === tm ? 1 : -1) : 0;
  let tx = p.home[0]*tm.dir + ball.x*.55 + att*5*tm.dir + (p.j === 6 && att > 0 ? 5*tm.dir : 0), tz = p.home[1]*(att > 0 ? 1.05 : .8) + ball.z*.3;

function pickCtrl(){
  const tm = teams[0], own = ball.owner, c0 = tm.chase[0]; if (!c0) return;
  if (own && own.tm === tm && !own.isGK) ctrl = own;
  else if (tm.passTarget && !own && !tm.passTarget.isGK && !tm.passTarget.off) ctrl = tm.passTarget;
  else { const c = c0 === ctrl && wantSwitch && tm.chase[1] ? tm.chase[1] : c0;
    if (!ctrl || ctrl.isGK || ctrl.off || wantSwitch || Math.hypot(ctrl.x - ball.x, ctrl.z - ball.z) > Math.hypot(c.x - ball.x, c.z - ball.z) + 3.5) ctrl = c; }
  wantSwitch = false;
}
function moveRefs(dt){
  const bx = state === 'foul' ? fk.x : ball.x, bz = state === 'foul' ? fk.z : ball.z;
  refs.forEach((r, i) => {
    let tx, tz;
    if (i === 0) { if (state === 'foul') { tx = bx + 1.8; tz = bz + 1.2; } else { tx = clamp(bx + (bx > 0 ? -6 : 6), -L + 2, L - 2); tz = clamp(bz + (bz > 0 ? -5 : 5), -Wd + 2, Wd - 2); } }
    else { tx = i === 1 ? clamp(bx, -L, 0) : clamp(bx, 0, L); tz = i === 1 ? -Wd - 1.2 : Wd + 1.2; }

    let da = Math.atan2(bx - r.x, bz - r.z) - r.face; da = Math.atan2(Math.sin(da), Math.cos(da)); r.face += da*(1 - Math.exp(-dt*8)); });
}

/* ---------- Simulation ---------- */
function simulate(dt){
  teams.forEach(tm => { tm.chase = tm.players.filter(p => !p.isGK && !p.off && p.stun <= 0).sort((a, b) => Math.hypot(a.x - ball.x, a.z - ball.z) - Math.hypot(b.x - ball.x, b.z - ball.z));
    if (tm.passT > 0 && (tm.passT -= dt) <= 0) tm.passTarget = null; });
  pickCtrl();
  const [ix, iz] = inputVec();
  players.forEach(p => {
    if (p.off) return;
    p.cd -= dt; p.stun -= dt; p.protect -= dt; p.lunge -= dt;
    if (penT > 0) { if (p === ball.owner && p !== ctrl && (p.think -= dt) <= 0) aiThink(p); p.vx = p.vz = 0; if (!p.isGK) return; }
    let dvx = 0, dvz = 0;
    if (p === ctrl && p.stun <= 0) {

      dvx = ix*sp; dvz = iz*sp;
      if (p.lunge > 0) { const d = Math.hypot(ball.x - p.x, ball.z - p.z) || 1; dvx = (ball.x - p.x)/d*10.5; dvz = (ball.z - p.z)/d*10.5; }
    } else {
      if (ball.owner === p && !p.isGK && (p.think -= dt) <= 0) { p.think = .28; aiThink(p); if (ball.owner !== p) return; }
      const [tx, tz, sp] = target(p), dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);

    }
    const k = 1 - Math.exp(-dt*(p === ctrl || p.isGK && p.save ? 14 : 8)); p.vx = lerp(p.vx, dvx, k); p.vz = lerp(p.vz, dvz, k);
    p.x = clamp(p.x + p.vx*dt, -L - 1.5, L + 1.5); p.z = clamp(p.z + p.vz*dt, -Wd - 1.5, Wd + 1.5);
    const sp = Math.hypot(p.vx, p.vz);
    const want = p.isGK || sp < .6 ? Math.atan2(ball.x - p.x, ball.z - p.z) : Math.atan2(p.vx, p.vz);
    let da = want - p.face; da = Math.atan2(Math.sin(da), Math.cos(da)); p.face += da*(1 - Math.exp(-dt*(p === ctrl ? 16 : 12)));
    p.lean = lerp(p.lean, p.isGK && p.save ? clamp((p.vx*Math.cos(p.face) - p.vz*Math.sin(p.face))/5, -1, 1) : 0, 1 - Math.exp(-dt*10));
  });
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) { const a = players[i], b = players[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
    if (d < .7 && d > .001) { const push = (.7 - d)/2; a.x -= dx/d*push; a.z -= dz/d*push; b.x += dx/d*push; b.z += dz/d*push; } }
  moveRefs(dt);

  // Ballon
  const o = ball.owner;
  if (o) {
    const tx = o.x + Math.sin(o.face)*.62, tz = o.z + Math.cos(o.face)*.62, k = 1 - Math.exp(-dt*18);
    ball.vx = o.vx; ball.vz = o.vz; ball.x = lerp(ball.x, tx, k); ball.z = lerp(ball.z, tz, k); ball.y = o.isGK ? 1.05 : BR;
    if (o.isGK) { if ((gkTimer -= dt) <= 0) { const m = bestPass(o); if (m) passTo(o, m); else kick(o, o.tm.dir, rnd(-.5, .5), 23, 8); } }
    else if (o.protect <= 0) other(o.tm).players.forEach(q => {
      if (state !== 'play' || ball.owner !== o || q.isGK || q.off || q.stun > 0 || Math.hypot(q.x - ball.x, q.z - ball.z) > 1.25) return;
      let win = false, tried = false; const behind = (o.x - q.x)*Math.sin(o.face) + (o.z - q.z)*Math.cos(o.face) > .45;
      if (q === ctrl) { if (q.lunge > 0) { tried = true; win = Math.random() < .85 + (q.tm.team.def - 4)*.05; q.lunge = 0; } else if (q.cd <= 0) win = Math.random() < 1.4*dt; }   // contact = récupération automatique possible
      else if (q.cd <= 0 && !(tuto && q.tm.human)) { win = Math.random() < ((q.tm.human ? 1.5 : 1 + diff*.5) + (q.tm.team.def - 4)*.15)*dt; tried = win; }
      if (tried && Math.random() < (behind ? .45 : .1) && !(tuto && q.tm.human === false)) return foul(q, o);
      if (win) { ball.owner = q; ball.last = q.tm; o.stun = .5; q.cd = .6; q.think = .4; q.protect = .5; teams.forEach(t => t.passTarget = null); charge = -1; sfx.tackle();

    });
  } else {
    ball.vy -= 9.8*dt; ball.x += ball.vx*dt; ball.y += ball.vy*dt; ball.z += ball.vz*dt;

    if ((ball.blockT -= dt) <= 0) ball.block = null;
    let best = null, bd = 1e9;
    players.forEach(p => { if (p === ball.block || p.stun > 0 || p.off) return; const d = Math.hypot(p.x - ball.x, p.z - ball.z);

      elHint.innerHTML = m === 1 ? '<kbd>Espace</kbd> tir · <kbd>E</kbd> passe · <kbd>F</kbd> passe longue · <kbd>Maj</kbd> sprint' : '<kbd>Espace</kbd> tacle · <kbd>E</kbd> changer de joueur · <kbd>Maj</kbd> sprint'; } } }

  if (!golden) { const m0 = Math.floor(clock/HALF*45); clock += dt; if (Math.floor(clock/HALF*45) !== m0) updateHud();

}

/* ---------- Boucle ---------- */
const mapCtx = elMap.getContext('2d');
function drawMap(){
  const g = mapCtx, w = 150, h = 100, X = x => (x + L)/(2*L)*(w - 8) + 4, Z = z => (z + Wd)/(2*Wd)*(h - 8) + 4;
  g.fillStyle = '#1f7a36'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1; g.strokeRect(4, 4, w - 8, h - 8);

}
function tick(dt){

  else if (state === 'play') { pollPad(); if (tuto) tutoTick(); if (state === 'play') simulate(dt); }
  else if (state === 'foul') { moveRefs(dt); if (stT > 1.9) { elMsg.classList.add('hide'); setState('play'); if (fk.pen) penalty(fk.tm); else restart(fk.tm, fk.x, fk.z, 'Coup franc', 7); } }
  else if (state === 'goal') {

  } else pollPad();
}
window.ncDebug = { step(n){ for (let i = 0; i < (n || 1); i++) tick(1/60); return this.info(); },
  info(){ return { state, half, clock:+clock.toFixed(1), score:teams.map(t => t.score), ball:[+ball.x.toFixed(1), +ball.z.toFixed(1)], owner:ball.owner ? ball.owner.tm.i + ':' + ball.owner.j : null,
    ctrl:ctrl ? ctrl.j : null, tuto:tuto ? tuto.step : null, off:players.filter(p => p.off).length, pen:+penT.toFixed(1) }; } };
let last = performance.now();
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000); last = ts; const time = ts/1000;
  tick(dt);
  const inMatch = state !== 'menu' && state !== 'load', live = state === 'play' || state === 'goal' || state === 'foul';
  if (inMatch) {
    players.forEach(p => { const a = p.actor; a.root.visible = !p.off; if (p.off) return; a.root.position.set(p.x, 0, p.z); a.root.rotation.y = p.face;

    ballMesh.visible = true; ballMesh.position.set(ball.x, ball.y, ball.z);
    ballMesh.rotation.z -= ball.vx*dt/BR*.5; ballMesh.rotation.x += ball.vz*dt/BR*.5;
    const c = ctrl && !ctrl.off ? ctrl : teams[0].players[6]; ctrlRing.visible = ctrlArrow.visible = true; ctrlRing.position.set(c.x, .03, c.z);
    ctrlArrow.position.set(c.x, 2.35 + Math.sin(time*5)*.08, c.z);
    let pm = null; if (state === 'play' && ctrl && ball.owner === ctrl && penT <= 0) { const [ax, az] = aimDir(); pm = bestPass(ctrl, ax, az); }
    passRing.visible = !!pm; if (pm) passRing.position.set(pm.x, .03, pm.z);
    const mk = tuto && marks[0]; markRing.visible = markArrow.visible = !!mk;
    if (mk) { markRing.position.set(mk[0], .04, mk[1]); markRing.scale.setScalar(1 + Math.sin(time*5)*.12); markArrow.position.set(mk[0], 3 + Math.sin(time*4)*.3, mk[1]); }
    const cm = CAMS[camMode], cx = clamp(ball.x*.82, -L + 9, L - 9); camT.set(cx, cm[0], cm[1] + ball.z*.3); camP.set(cx, 0, ball.z*.4 - 2);
    const cf = 1 - Math.exp(-dt*(state === 'intro' ? 1.5 : 3)); camera.position.lerp(camT, cf); camL.lerp(camP, cf);

  } else {
    if (actors) actors.forEach(t => t.forEach(a => a.root.visible = false)); refs.forEach(r => r.actor.root.visible = false);
    ballMesh.visible = ctrlRing.visible = ctrlArrow.visible = passRing.visible = markRing.visible = markArrow.visible = false;
    if (preview) { preview.root.visible = true; preview.root.rotation.y = Math.sin(time*.6)*.6 - .1; preview.update(dt, 0); }

/* ---------- Démarrage ---------- */
let started = false;
function ready(){
  if (started) return; started = true;
  if (proto) { sets = [0, 1, 2, 3, 4, 5].map(makeSet); paintSet(sets[5], REFKIT); }
  actors = [0, 1].map(t => HOME.map((h, j) => makeActor(proto ? sets[t*2 + (j ? 0 : 1)] : null)));
  refs = [0, 1, 2].map(() => { const a = makeActor(proto ? sets[5] : null); a.recolor(REFKIT); return { x:0, z:0, vx:0, vz:0, face:0, actor:a }; });

try { new T.GLTFLoader().load(MODEL_URL, g => { try { prepareModel(g); } catch (e) { proto = null; console.warn(e); } ready(); }, undefined, () => ready()); } catch (e) { ready(); }

})();
