  const st = Math.max(-1, Math.min(1, (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x)), hb = !!keys.Space;
  trackNear(); const on = car.dist <= TW / 2 + .6; car.boost = Math.max(0, car.boost - dt);
  const maxF = car.boost > 0 ? 40 : on ? 29 : 11; let v = car.v;
  if (thr > .05) v += (v < 0 ? 26 : 15) * thr * dt; else if (thr < -.05) v += (v > 0 ? -28 : -9) * -thr * dt; else v -= Math.sign(v) * Math.min(Math.abs(v), (on ? 3 : 8) * dt);
  if (hb) v -= Math.sign(v) * Math.min(Math.abs(v), 10 * dt);
  if (v > maxF) v = Math.max(maxF, v - 25 * dt); if (v < -9) v = -9;
  const grip = Math.max(Math.abs(thr) > .05 ? .45 : 0, Math.min(1, Math.abs(v) / 7)) * (hb ? 2.7 : 1.75) * (1 - Math.min(.4, Math.abs(v) / 100));
  me.yaw -= st * grip * dt * (v < 0 ? -1 : 1);
  const nx = me.pos.x + Math.sin(me.yaw) * v * dt, nz = me.pos.z + Math.cos(me.yaw) * v * dt;
  const blk = (x, z) => hits(x - .9, .45, z - .9, x + .9, 1.4, z + .9).length > 0;
  if (!blk(nx, nz)) { me.pos.x = nx; me.pos.z = nz; }
  else { if (Math.abs(v) > 8) tone(110, 0, .2, 'sawtooth', .08); if (!blk(nx, me.pos.z)) me.pos.x = nx; else if (!blk(me.pos.x, nz)) me.pos.z = nz; else v = -v * .25; v *= .55; }
  car.v = v; me.speed = Math.abs(v); me.pos.y = 0; me.vel.set(0, 0, 0); me.ground = true; me.stand = null;
  if (inLava(me.pos)) { toast('🔥 La voiture a fini dans la lave !', 2000); exitCar(true); respawn(GARAGE.clone()); return; }
  for (const b of BOOSTS) if (Math.hypot(me.pos.x - b.x, me.pos.z - b.z) < 2.8) { if (car.boost < .2) { tone(700, 0, .3, 'sawtooth', .05); tone(1400, .08, .3, 'sawtooth', .04); } car.boost = 1.3; }
  if (!ptrs.size) { const tg = me.yaw + Math.PI; const d = ((tg - camYaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; camYaw += d * Math.min(1, dt * 3.2); }
  if (car.mesh) car.mesh.userData.wheels.forEach(w => { w.children[0].rotation.x += v * dt / .38; });
}
const bestLap = () => ls.get('arc_lap', 0);
function lapDone(lt){
  const b = bestLap(); tone(1046, 0, .2, 'triangle'); tone(1318, .1, .25, 'triangle');
  if (!b || lt < b) { ls.set('arc_lap', +lt.toFixed(2)); toast('⚡ Nouveau record de tour : ' + lt.toFixed(2) + ' s !', 2500); submitLap(lt); } else toast('Tour en ' + lt.toFixed(2) + ' s', 1600);
}
function submitLap(lt){
  if (window.NO_SUBMIT || lt < 8 || lt > 600) return;
  net('PUT', '/race/' + UIDW, {n: NAME, t: +lt.toFixed(2)}).then(r => { if (r && r.ok) { refreshBoard(); if (!boardRows || !boardRows.length || lt < boardRows[0].t) sysMsg(NAME + ' bat le record du circuit : ' + lt.toFixed(2) + ' s 🏎️'); } }).catch(() => {});
}
function raceDone(laps){
  const tot = laps.reduce((a, b) => a + b, 0), best3 = ls.get('arc_race3', 0), rec = !best3 || tot < best3; if (rec) ls.set('arc_race3', +tot.toFixed(2));
  stat('arc_world', v => { v.races = (v.races | 0) + 1; }); sfx.win();
  if (rec) sysMsg(NAME + ' a bouclé 3 tours en ' + tot.toFixed(1) + ' s 🏁');
  modal('🏁 Course terminée !', '<p class="note">3 tours en <b>' + tot.toFixed(2) + ' s</b>' + (rec ? '<br><b style="color:var(--gold)">★ Nouveau record !</b>' : '<br>Record : ' + best3 + ' s') + '</p><p class="note">' + laps.map((l, i) => 'Tour ' + (i + 1) + ' : ' + l.toFixed(2) + ' s').join('<br>') + '</p>', [['Continuer à rouler']]);
}
function raceUpdate(dt){
  const Rc = car.race; if (!Rc) return;
  if (Rc.started) Rc.clock += dt;
  const g = GATES[Rc.next], di = Math.min(Math.abs(car.ni - g), TN - Math.abs(car.ni - g));
  if (car.dist <= TW / 2 + 1 && di <= 4) {
    if (Rc.next === 0) {
      if (!Rc.started) { Rc.started = true; Rc.clock = 0; Rc.lapStart = 0; Rc.laps = []; sfx.ok(); toast('🏁 Chrono lancé : 3 tours !', 1800); }
      else { const lt = Rc.clock - Rc.lapStart; Rc.lapStart = Rc.clock; Rc.laps.push(lt); lapDone(lt); if (Rc.laps.length >= 3) { raceDone(Rc.laps.slice()); Rc.started = false; } }
      Rc.next = 1;
    } else { Rc.next = (Rc.next + 1) % GATES.length; tone(990, 0, .06, 'triangle', .05); }
  }
  const kmh = Math.round(Math.abs(car.v) * 3.6), bl = bestLap();
  const lapT = (Rc.clock - Rc.lapStart).toFixed(1) + ' s';
  miniTxt = Rc.started ? (COARSE || innerWidth < 600 ? '🏁 ' + Math.min(3, Rc.laps.length + 1) + '/3 · ⏱ ' + lapT + ' · ' + kmh + ' km/h' : '🏎️ Tour ' + Math.min(3, Rc.laps.length + 1) + '/3 · ⏱ ' + lapT + (bl ? ' · record ' + bl.toFixed(2) + ' s' : '') + ' · ' + kmh + ' km/h') : '🏎️ ' + kmh + ' km/h · franchis la ligne 🏁 pour le chrono';
}
function carFor(o){
  if (o.carC === null || o.carC === undefined) { if (o.car) { scene.remove(o.car); o.car = null; } return; }
  if (!o.car || o.carCi !== o.carC) { if (o.car) scene.remove(o.car); o.car = makeCar(o.carC); o.carCi = o.carC; scene.add(o.car); }
  o.car.position.set(o.pos.x, 0, o.pos.z); o.car.rotation.y = o.yaw;
}
/* ---------- avatar : personnalisation ---------- */
function editAvatar(first){
  const sw = (arr, key) => '<div class="sw" data-k="' + key + '">' + arr.map((c, i) => '<button type="button" data-i="' + i + '" class="' + (AV[key] === i ? 'on' : '') + '" style="background:' + c + '" aria-label="Couleur ' + (i + 1) + '"></button>').join('') + '</div>';
  modal(first ? 'Bienvenue dans le Monde Néon !' : 'Mon avatar', '<div class="av"><label class="lbl" style="margin:0">Pseudo</label><input class="inp" id="avName" maxlength="16" value="' + esc(NAME) + '" autocomplete="off"><div class="lbl" style="margin:0">T-shirt</div>' + sw(SHIRT, 's') + '<div class="lbl" style="margin:0">Pantalon</div>' + sw(PANTS, 'p') + '<div class="lbl" style="margin:0">Peau</div>' + sw(SKIN, 'k') + '<div class="lbl" style="margin:0">Chapeau</div><div class="seg" id="avHat">' + HATS.concat(SHOP.h.filter(x => owned.has('h:' + x[0])).map(x => [x[0], x[2]])).map(h => '<button type="button" data-h="' + h[0] + '" class="' + (AV.h === h[0] ? 'on' : '') + '">' + h[1] + '</button>').join('') + '</div></div>',
    [[first ? 'Entrer dans le monde ▶' : 'Enregistrer', () => {
      const n = $('avName').value.replace(/\s+/g, ' ').trim().slice(0, 16); if (n.length >= 2 && n !== NAME) { NAME = n; ls.set('gs_name', n); }
      ls.set('arc_avatar', AV); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); if (joined) net('PUT', '/world/players/' + PID, myRecord()); sfx.ok(); if (first) setTimeout(showHelp, 60);
    }]]);
  const box = $('modal').querySelector('.av');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = b.closest('.sw'); if (s) { AV[s.dataset.k] = +b.dataset.i; s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } else if (b.dataset.h) { AV.h = b.dataset.h; $('avHat').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } sfx.click(); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); });
}
function showHelp(){
  modal('Comment jouer', '<div class="help">' + (COARSE ? '<p>🕹️ <b>Joystick</b> en bas à gauche pour marcher, <b>SAUTER</b> à droite.</p><p>👆 Fais glisser un doigt sur l\'écran pour tourner la caméra, pince pour zoomer.</p>' : '<p>⌨️ <b>ZQSD</b>, <b>WASD</b> ou les <b>flèches</b> pour marcher, <b>Espace</b> pour sauter.</p><p>🖱️ Clique-glisse pour tourner la caméra, molette pour zoomer.</p><p><b>T</b> pour discuter, <b>B</b> pour construire, <b>E</b> pour entrer dans un portail.</p>') +
    '<p>🚪 <b>Portails</b> : marche dans un portail pour lancer le jeu.</p><p>🏆 <b>Parcours</b> à droite de la place : saute de plateforme en plateforme au-dessus de la lave.</p><p>🧱 <b>Construction</b> à gauche : active 🧱 et touche le sol pour poser des blocs, visibles par tous les joueurs.</p><p>🎮 <b>Mini-jeux</b> au sud de la place : 🐱 Chat perché (à plusieurs), 💥 Sol fragile, 🪙 Pluie de pièces, et des trampolines.</p><p>🏎️ <b>Circuit</b> au nord, derrière les portails : prends une voiture au garage et fais 3 tours chronométrés. Les meilleurs tours s\'affichent sur le panneau, pour tous les joueurs.</p><p>🪙 Ramasse les pièces cachées dans le monde, puis dépense-les à la <b>boutique</b> (stand sur la place ou bouton 🪙) : chapeaux, compagnons, traînées et tenues, visibles par tous.</p><p>💬 Les autres joueurs connectés apparaissent en direct : dis bonjour !</p></div>', [['C\'est parti ▶', () => ls.set('arc_world_help', 1)]]);
}
$('avBtn').onclick = () => editAvatar(false); $('coinsP').onclick = () => { sfx.click(); openShop(); }; $('helpBtn').onclick = showHelp;

/* ---------- boucle ---------- */
let lastT = performance.now(), T = 0;
function frame(now){
  requestAnimationFrame(frame); if (document.hidden) { lastT = now; return; }
  const dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = now; T += dt;
  if (car.on) carPhysics(dt); else physics(dt); zones(dt);
  me.av.root.position.copy(me.pos); me.av.root.rotation.y = me.yaw; animate(me.av, car.on ? 0 : me.speed, !me.ground, dt); petFollow(me, me.pos, me.yaw, dt); if (me.speed > 1.5 || !me.ground) emitTrail(me, AV.tr, me.pos, dt);
  if (car.on && car.mesh) { seat(me.av); me.av.root.position.y += .15; car.mesh.position.set(me.pos.x, 0, me.pos.z); car.mesh.rotation.y = me.yaw; }
  for (const o of others.values()) {
    if (o.target) { o.pos.lerp(o.target, Math.min(1, dt * 10)); let dy = ((o.tyaw - o.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; o.yaw += dy * Math.min(1, dt * 10); }
    o.av.root.position.copy(o.pos); o.av.root.rotation.y = o.yaw; animate(o.av, o.a === 1 && o.carC == null ? 6 : 0, o.a === 2, dt); petFollow(o, o.pos, o.yaw, dt); if (o.a === 1 || o.a === 2) emitTrail(o, o.tr, o.pos, dt);
    if (o.carC != null) { seat(o.av); o.av.root.position.y += .15; } carFor(o);
    if (o.bubble && (o.bubbleT -= dt) <= 0) { o.av.root.remove(o.bubble); o.bubble = null; }
  }
  if (me.bubble && (me.bubbleT -= dt) <= 0) { me.av.root.remove(me.bubble); me.bubble = null; }
  if (blocksDirty) rebuildBlocks();
  vinyl.rotation.y += dt * .5; sun.position.copy(me.pos).add(SUNOFF); sun.target.position.copy(me.pos); sun.target.updateMatrixWorld(); clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 320) c.position.x = -320; }); if (window.LAVAT) { LAVAT.offset.x += dt * .015; LAVAT.offset.y += dt * .01; } trailUpdate(dt); shopCoin.rotation.z += dt * 2; trophy.rotation.y += dt * 1.2; coins.forEach(c => { c.m.rotation.z += dt * 2.5; });
  portals.forEach((p, i) => { p.veil.material.opacity = .32 + Math.sin(T * 2 + i) * .14; });
  window.LAVA2.material.opacity = .18 + Math.sin(T * 1.7) * .08;
  if (pLife > 0) { pLife -= dt; for (let i = 0; i < PN; i++) { pVel[i*3+1] -= 9 * dt; pPos[i*3] += pVel[i*3] * dt; pPos[i*3+1] += pVel[i*3+1] * dt; pPos[i*3+2] += pVel[i*3+2] * dt; } pGeo.attributes.position.needsUpdate = true; if (pLife <= 0) parts.visible = false; }
  updateCam(); renderer.render(scene, cam); sendPos();
}
updCoins(); shadowize(scene);
FBA.isAdmin().then(a => { if (!a) return; ISADM = true; updCoins(); $('admBtn').classList.remove('hide'); document.body.classList.add('isadm'); setTag(); if (joined) net('PUT', '/world/players/' + PID, myRecord()); });
$('load').remove(); requestAnimationFrame(frame); connect();
if (firstTime) editAvatar(true); else if (!ls.get('arc_world_help', 0)) showHelp();
canvas.focus({preventScroll: true});
</script>
