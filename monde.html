}

function openShop(tab){

    const b = e.target.closest('[data-act]'); if (!b) return; const id = b.dataset.id, it = SHOP[shopTab].find(x => x[0] === id); if (!it) return;

    else if (b.dataset.act === 'on') { AV[shopTab] = id; applyAV(); sfx.ok(); }

function renderShop(){

    '<div class="shopGrid">' + SHOP[shopTab].map(([id, e, n, price]) => { const own = owned.has(shopTab + ':' + id), eq = AV[shopTab] === id;

}
/* compagnons */
const dotT = tex(cv(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); }));
const noteT = tex(cv(64, 64, (g) => { g.font = '52px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText('♪', 32, 36); }));
function makePet(kind){
  const g = new THREE.Group(), em = (c, i) => new THREE.MeshLambertMaterial({color: c, emissive: c, emissiveIntensity: i === undefined ? .4 : i});
  if (kind === 'cube') { const m = new THREE.Mesh(new THREE.BoxGeometry(.45, .45, .45), em(0xb86bff, .6)); g.add(m); g.userData.spin = m; }
  if (kind === 'orb') { g.add(new THREE.Mesh(new THREE.SphereGeometry(.24, 16, 12), new THREE.MeshBasicMaterial({color: 0xb9f7ff}))); const s = new THREE.Sprite(new THREE.SpriteMaterial({map: dotT, color: 0x38e1ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})); s.scale.setScalar(1.5); g.add(s); }
  if (kind === 'duck') { const y = em(0xffd84d, .15), b = new THREE.Mesh(new THREE.SphereGeometry(.26, 14, 10), y); b.scale.set(1, .85, 1.2); g.add(b); const h = new THREE.Mesh(new THREE.SphereGeometry(.17, 12, 10), y); h.position.set(0, .25, .2); g.add(h); const k = new THREE.Mesh(new THREE.ConeGeometry(.07, .18, 8), em(0xff8a1f, .2)); k.rotation.x = Math.PI / 2; k.position.set(0, .23, .4); g.add(k); }
  if (kind === 'ufo') { const d = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .1, 24), em(0x9aa0b5, .2)); g.add(d); const dome = new THREE.Mesh(new THREE.SphereGeometry(.2, 14, 10, 0, 6.283, 0, Math.PI / 2), new THREE.MeshBasicMaterial({color: 0x7ef9ff, transparent: true, opacity: .85})); dome.position.y = .05; g.add(dome); const r = new THREE.Mesh(new THREE.TorusGeometry(.42, .03, 6, 24), new THREE.MeshBasicMaterial({color: 0x3dffa2})); r.rotation.x = Math.PI / 2; g.add(r); g.userData.spin = d; }
  if (kind === 'dragon') { const gr = em(0x2fe08c, .3), b = new THREE.Mesh(new THREE.BoxGeometry(.3, .28, .55), gr); g.add(b); const h = new THREE.Mesh(new THREE.BoxGeometry(.26, .24, .26), gr); h.position.set(0, .16, .36); g.add(h); const wl = new THREE.Mesh(new THREE.BoxGeometry(.5, .04, .3), em(0xb86bff, .4)); wl.position.set(-.38, .1, 0); const wr = wl.clone(); wr.position.x = .38; g.add(wl, wr); g.userData.wings = [wl, wr]; const t = new THREE.Mesh(new THREE.ConeGeometry(.08, .4, 6), gr); t.rotation.x = -Math.PI / 2; t.position.set(0, 0, -.45); g.add(t); }
  return g;
}
function petSync(h, kind){ kind = kind || null; if (h.petKind === kind) return; if (h.petObj) scene.remove(h.petObj); h.petKind = kind; h.petObj = kind ? makePet(kind) : null; h.ph = Math.random() * 6; if (h.petObj) { scene.add(h.petObj); h.petInit = false; } }
function petFollow(h, pos, yaw, dt){
  const p = h.petObj; if (!p) return; const s = Math.sin(yaw), c = Math.cos(yaw);
  const tx = pos.x - s * .8 + c * .9, tz = pos.z - c * .8 - s * .9, ty = pos.y + 2.35 + Math.sin(T * 2.5 + h.ph) * .15;
  if (!h.petInit) { p.position.set(tx, ty, tz); h.petInit = true; } else { const k = Math.min(1, dt * 6); p.position.x += (tx - p.position.x) * k; p.position.y += (ty - p.position.y) * k; p.position.z += (tz - p.position.z) * k; }
  p.rotation.y = yaw; if (p.userData.spin) p.userData.spin.rotation.y += dt * 3; if (p.userData.wings) { const a = Math.sin(T * 12) * .5; p.userData.wings[0].rotation.z = a; p.userData.wings[1].rotation.z = -a; }
}
/* traînées */
const smat = (map, color, add) => new THREE.SpriteMaterial({map, color, transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending});
const TRAIL = {spark: [smat(dotT, 0xfff3a6, 1), smat(dotT, 0xffffff, 1)], fire: [smat(dotT, 0xff6a1a, 1), smat(dotT, 0xffc23d, 1)], rainbow: [0, 40, 60, 140, 200, 280].map(h => smat(dotT, new THREE.Color('hsl(' + h + ',100%,60%)'), 1)), notes: [smat(noteT, 0x38e1ff), smat(noteT, 0xff4fa3), smat(noteT, 0xb86bff)]};
const tPool = []; let tNext = 0;
for (let i = 0; i < 240; i++) { const s = new THREE.Sprite(TRAIL.spark[0]); s.visible = false; scene.add(s); tPool.push({s, life: 0, max: 1, vy: 0, size: .3}); }
function emitTrail(h, kind, pos, dt){
  if (!kind || !TRAIL[kind]) return; h.trAcc = (h.trAcc || 0) + dt * (kind === 'notes' ? 9 : 26);
  while (h.trAcc > 1) { h.trAcc--; const p = tPool[tNext = (tNext + 1) % tPool.length], mats = TRAIL[kind];
    p.s.material = mats[Math.random() * mats.length | 0]; p.s.position.set(pos.x + rnd(-.3, .3), pos.y + (kind === 'notes' ? 1.3 : .25) + rnd(0, .35), pos.z + rnd(-.3, .3));
    p.max = p.life = kind === 'notes' ? 1.4 : .75; p.vy = kind === 'fire' ? 1.8 : kind === 'notes' ? 1 : .35; p.size = kind === 'notes' ? .5 : .34; p.s.visible = true; }
}
function trailUpdate(dt){ for (const p of tPool) { if (p.life <= 0) continue; p.life -= dt; p.s.position.y += p.vy * dt; const k = Math.max(0, p.life / p.max); p.s.scale.setScalar(p.size * (.25 + .75 * k)); if (p.life <= 0) p.s.visible = false; } }

scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); petSync(me, AV.pet);

  const sw = (arr, key) => '<div class="sw" data-k="' + key + '">' + arr.map((c, i) => '<button type="button" data-i="' + i + '" class="' + (AV[key] === i ? 'on' : '') + '" style="background:' + c + '" aria-label="Couleur ' + (i + 1) + '"></button>').join('') + '</div>';
  modal(first ? 'Bienvenue dans le Monde Néon !' : 'Mon avatar', '<div class="av"><label class="lbl" style="margin:0">Pseudo</label><input class="inp" id="avName" maxlength="16" value="' + esc(NAME) + '" autocomplete="off"><div class="lbl" style="margin:0">T-shirt</div>' + sw(SHIRT, 's') + '<div class="lbl" style="margin:0">Pantalon</div>' + sw(PANTS, 'p') + '<div class="lbl" style="margin:0">Peau</div>' + sw(SKIN, 'k') + '<div class="lbl" style="margin:0">Chapeau</div><div class="seg" id="avHat">' + HATS.concat(SHOP.h.filter(x => owned.has('h:' + x[0])).map(x => [x[0], x[2]])).map(h => '<button type="button" data-h="' + h[0] + '" class="' + (AV.h === h[0] ? 'on' : '') + '">' + h[1] + '</button>').join('') + '</div></div>',
    [[first ? 'Entrer dans le monde ▶' : 'Enregistrer', () => {
      const n = $('avName').value.replace(/\s+/g, ' ').trim().slice(0, 16); if (n.length >= 2 && n !== NAME) { NAME = n; ls.set('gs_name', n); }
      ls.set('arc_avatar', AV); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); if (joined) net('PUT', '/world/players/' + PID, myRecord()); sfx.ok(); if (first) setTimeout(showHelp, 60);
    }]]);
  const box = $('modal').querySelector('.av');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = b.closest('.sw'); if (s) { AV[s.dataset.k] = +b.dataset.i; s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } else if (b.dataset.h) { AV.h = b.dataset.h; $('avHat').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } sfx.click(); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); });
}
function showHelp(){
  modal('Comment jouer', '<div class="help">' + (COARSE ? '<p>🕹️ <b>Joystick</b> en bas à gauche pour marcher, <b>SAUTER</b> à droite.</p><p>👆 Fais glisser un doigt sur l\'écran pour tourner la caméra, pince pour zoomer.</p>' : '<p>⌨️ <b>ZQSD</b>, <b>WASD</b> ou les <b>flèches</b> pour marcher, <b>Espace</b> pour sauter.</p><p>🖱️ Clique-glisse pour tourner la caméra, molette pour zoomer.</p><p><b>T</b> pour discuter, <b>B</b> pour construire, <b>E</b> pour entrer dans un portail.</p>') +
    '<p>🚪 <b>Portails</b> : marche dans un portail pour lancer le jeu.</p><p>🏆 <b>Parcours</b> à droite de la place : saute de plateforme en plateforme au-dessus de la lave.</p><p>🧱 <b>Construction</b> à gauche : active 🧱 et touche le sol pour poser des blocs, visibles par tous les joueurs.</p><p>🎮 <b>Mini-jeux</b> au sud de la place : 🐱 Chat perché (à plusieurs), 💥 Sol fragile, 🪙 Pluie de pièces, et des trampolines.</p><p>🪙 Ramasse les pièces cachées dans le monde, puis dépense-les à la <b>boutique</b> (stand sur la place ou bouton 🪙) : chapeaux, compagnons, traînées et tenues, visibles par tous.</p><p>💬 Les autres joueurs connectés apparaissent en direct : dis bonjour !</p></div>', [['C\'est parti ▶', () => ls.set('arc_world_help', 1)]]);
}
$('avBtn').onclick = () => editAvatar(false); $('coinsP').onclick = () => { sfx.click(); openShop(); }; $('helpBtn').onclick = showHelp;

/* ---------- boucle ---------- */
let lastT = performance.now(), T = 0;
function frame(now){
  requestAnimationFrame(frame); if (document.hidden) { lastT = now; return; }
  const dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = now; T += dt;
  physics(dt); zones(dt);
  me.av.root.position.copy(me.pos); me.av.root.rotation.y = me.yaw; animate(me.av, me.speed, !me.ground, dt); petFollow(me, me.pos, me.yaw, dt); if (me.speed > 1.5 || !me.ground) emitTrail(me, AV.tr, me.pos, dt);
  for (const o of others.values()) {
    if (o.target) { o.pos.lerp(o.target, Math.min(1, dt * 10)); let dy = ((o.tyaw - o.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; o.yaw += dy * Math.min(1, dt * 10); }
    o.av.root.position.copy(o.pos); o.av.root.rotation.y = o.yaw; animate(o.av, o.a === 1 ? 6 : 0, o.a === 2, dt); petFollow(o, o.pos, o.yaw, dt); if (o.a === 1 || o.a === 2) emitTrail(o, o.tr, o.pos, dt);
    if (o.bubble && (o.bubbleT -= dt) <= 0) { o.av.root.remove(o.bubble); o.bubble = null; }
  }
  if (me.bubble && (me.bubbleT -= dt) <= 0) { me.av.root.remove(me.bubble); me.bubble = null; }
  if (blocksDirty) rebuildBlocks();
  vinyl.rotation.y += dt * .5; trailUpdate(dt); shopCoin.rotation.z += dt * 2; trophy.rotation.y += dt * 1.2; coins.forEach(c => { c.m.rotation.z += dt * 2.5; });
  portals.forEach((p, i) => { p.veil.material.opacity = .32 + Math.sin(T * 2 + i) * .14; });
  window.LAVA2.material.opacity = .18 + Math.sin(T * 1.7) * .08;
  if (pLife > 0) { pLife -= dt; for (let i = 0; i < PN; i++) { pVel[i*3+1] -= 9 * dt; pPos[i*3] += pVel[i*3] * dt; pPos[i*3+1] += pVel[i*3+1] * dt; pPos[i*3+2] += pVel[i*3+2] * dt; } pGeo.attributes.position.needsUpdate = true; if (pLife <= 0) parts.visible = false; }
  updateCam(); renderer.render(scene, cam); sendPos();
}
updCoins();
$('load').remove(); requestAnimationFrame(frame); connect();
