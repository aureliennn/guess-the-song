{ const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, b = Math.random() * 1.3, r = 220; p[i*3] = Math.cos(a) * Math.cos(b) * r; p[i*3+1] = Math.sin(b) * r + 10; p[i*3+2] = Math.sin(a) * Math.cos(b) * r; } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({color: 0xd9d0ff, size: .9, fog: false}))); }

{ // sol principal (de x=-100 à 37)

  const t = text.length > 34 ? text.slice(0, 33) + '…' : text;
  const c = cv(768, 128, (g, Wd, Hd) => { g.font = '700 46px Inter, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; const tw = Math.min(Wd - 10, g.measureText(t).width + 50); g.fillStyle = '#ffffff'; const x = (Wd - tw) / 2; g.beginPath(); g.roundRect ? g.roundRect(x, 14, tw, Hd - 28, 26) : g.rect(x, 14, tw, Hd - 28); g.fill(); g.fillStyle = '#1a1030'; g.fillText(t, Wd / 2, Hd / 2 + 2, Wd - 40); });
  o.bubble = new THREE.Sprite(new THREE.SpriteMaterial({map: tex(c), transparent: true, depthWrite: false})); o.bubble.scale.set(6, 1, 1); o.bubble.position.y = 3.6; root.add(o.bubble); o.bubbleT = 6;
}
function openChat(){ $('chatF').classList.remove('hide'); $('chatI').focus(); }
$('chatBtn').onclick = () => { if ($('chatF').classList.contains('hide')) openChat(); else { $('chatF').classList.add('hide'); $('chatI').blur(); } };
$('chatI').addEventListener('keydown', e => { if (e.key === 'Escape') { $('chatF').classList.add('hide'); $('chatI').blur(); } e.stopPropagation(); });
$('chatF').onsubmit = e => {
  e.preventDefault(); const m = $('chatI').value.replace(/\s+/g, ' ').trim().slice(0, 120); $('chatI').value = '';
  if (m) { net('POST', '/world/chat', {n: NAME, m, p: PID, t: SV}); }
  $('chatF').classList.add('hide'); $('chatI').blur();
};
function sysMsg(m){ net('POST', '/world/chat', {n: '★', m: m.slice(0, 120), p: PID, sys: 1, t: SV}); }

/* ---------- zones, portails, parcours ---------- */
let promptAct = null, promptTxt = '';
function setPrompt(txt, act){ if (txt === promptTxt) return; promptTxt = txt; promptAct = act; const b = $('prompt'); b.classList.toggle('hide', !txt); if (txt) b.textContent = txt; }
$('prompt').onclick = () => promptAct && promptAct();
function zones(dt){
  let near = null; for (const p of portals) if (Math.hypot(me.pos.x - p.x, me.pos.z - p.z) < 2.6 && me.pos.y < 3) near = p;
  if (near) setPrompt('Entrer : ' + near.name + (COARSE ? ' ▶' : ' (E)'), () => { sfx.ok(); location.href = near.href; }); else setPrompt('', null);
  const st = me.stand && me.stand.tag;
  if (st === 'start' && !me.obby) { me.obby = {t0: performance.now()}; me.cp.set(34.5, .25, 0); toast('🏁 Parcours lancé ! Rejoins le trophée sans tomber dans la lave.', 2500); }
  if (st && st.startsWith('cp') && me.obby) { const i = +st.slice(2), p = OB[i]; if (me.cp.x !== p.x) { me.cp.set(p.x, p.y, p.z); sfx.ok(); toast('✅ Point de contrôle !', 1500); } }
  if (st === 'fin' && me.obby) { const s = (performance.now() - me.obby.t0) / 1000; me.obby = null; me.cp.copy(SPAWN); const best = ls.get('arc_obby_best', 0); const rec = !best || s < best; if (rec) ls.set('arc_obby_best', +s.toFixed(1)); sfx.win(); burst(trophy.position); stat('arc_world', v => { v.obby = (v.obby | 0) + 1; }); modal('🏆 Parcours terminé !', '<p class="note">Temps : <b>' + s.toFixed(1) + ' s</b>' + (rec ? '<br><b style="color:var(--gold)">★ Nouveau record !</b>' : '<br>Record : ' + best + ' s') + '</p>', [['Refaire le parcours', () => respawn(new THREE.Vector3(33, 0, 0))], ['Retour à la place', () => respawn(SPAWN), true]]); sysMsg(NAME + ' a terminé le parcours en ' + s.toFixed(1) + ' s 🏆'); }
  if (me.obby) { $('obbyT').classList.remove('hide'); $('obbyT').textContent = '⏱ ' + ((performance.now() - me.obby.t0) / 1000).toFixed(1) + ' s'; } else $('obbyT').classList.add('hide');
  coins.forEach(c => { if (c.back > 0) { c.back -= dt; if (c.back <= 0) c.m.visible = true; return; } if (me.pos.distanceTo(new THREE.Vector3(c.m.position.x, c.m.position.y - 1, c.m.position.z)) < 1.3) { c.m.visible = false; c.back = 60; coinCount++; ls.set('arc_coins', coinCount); $('coinsP').textContent = '🪙 ' + coinCount; tone(1320, 0, .08, 'square', .05); tone(1760, .07, .12, 'square', .05); } });
}
/* particules de victoire */
const PN = 260, pPos = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3); let pLife = 0;
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const parts = new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0xffd166, size: .35})); parts.visible = false; scene.add(parts);
function burst(at){ for (let i = 0; i < PN; i++) { pPos[i*3] = at.x; pPos[i*3+1] = at.y + 2; pPos[i*3+2] = at.z; const a = Math.random() * 6.283, s = 2 + Math.random() * 6; pVel[i*3] = Math.cos(a) * s; pVel[i*3+1] = 4 + Math.random() * 9; pVel[i*3+2] = Math.sin(a) * s; } pLife = 3; parts.visible = true; }

/* ---------- avatar : personnalisation ---------- */
function editAvatar(first){
  const sw = (arr, key) => '<div class="sw" data-k="' + key + '">' + arr.map((c, i) => '<button type="button" data-i="' + i + '" class="' + (AV[key] === i ? 'on' : '') + '" style="background:' + c + '" aria-label="Couleur ' + (i + 1) + '"></button>').join('') + '</div>';
  modal(first ? 'Bienvenue dans le Monde Néon !' : 'Mon avatar', '<div class="av"><label class="lbl" style="margin:0">Pseudo</label><input class="inp" id="avName" maxlength="16" value="' + esc(NAME) + '" autocomplete="off"><div class="lbl" style="margin:0">T-shirt</div>' + sw(SHIRT, 's') + '<div class="lbl" style="margin:0">Pantalon</div>' + sw(PANTS, 'p') + '<div class="lbl" style="margin:0">Peau</div>' + sw(SKIN, 'k') + '<div class="lbl" style="margin:0">Chapeau</div><div class="seg" id="avHat">' + HATS.map(h => '<button type="button" data-h="' + h[0] + '" class="' + (AV.h === h[0] ? 'on' : '') + '">' + h[1] + '</button>').join('') + '</div></div>',
    [[first ? 'Entrer dans le monde ▶' : 'Enregistrer', () => {
      const n = $('avName').value.replace(/\s+/g, ' ').trim().slice(0, 16); if (n.length >= 2 && n !== NAME) { NAME = n; ls.set('gs_name', n); }
      ls.set('arc_avatar', AV); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); if (joined) net('PUT', '/world/players/' + PID, myRecord()); sfx.ok(); if (first) setTimeout(showHelp, 60);
    }]]);
  const box = $('modal').querySelector('.av');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const s = b.closest('.sw'); if (s) { AV[s.dataset.k] = +b.dataset.i; s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } else if (b.dataset.h) { AV.h = b.dataset.h; $('avHat').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); } sfx.click(); scene.remove(me.av.root); me.av = makeAvatar(AV); scene.add(me.av.root); setTag(); });
}
function showHelp(){
  modal('Comment jouer', '<div class="help">' + (COARSE ? '<p>🕹️ <b>Joystick</b> en bas à gauche pour marcher, <b>SAUTER</b> à droite.</p><p>👆 Fais glisser un doigt sur l\'écran pour tourner la caméra, pince pour zoomer.</p>' : '<p>⌨️ <b>ZQSD</b>, <b>WASD</b> ou les <b>flèches</b> pour marcher, <b>Espace</b> pour sauter.</p><p>🖱️ Clique-glisse pour tourner la caméra, molette pour zoomer.</p><p><b>T</b> pour discuter, <b>B</b> pour construire, <b>E</b> pour entrer dans un portail.</p>') +
    '<p>🚪 <b>Portails</b> : marche dans un portail pour lancer le jeu.</p><p>🏆 <b>Parcours</b> à droite de la place : saute de plateforme en plateforme au-dessus de la lave.</p><p>🧱 <b>Construction</b> à gauche : active 🧱 et touche le sol pour poser des blocs, visibles par tous les joueurs.</p><p>🪙 Ramasse les pièces cachées dans le monde.</p><p>💬 Les autres joueurs connectés apparaissent en direct : dis bonjour !</p></div>', [['C\'est parti ▶', () => ls.set('arc_world_help', 1)]]);
}
$('avBtn').onclick = () => editAvatar(false); $('helpBtn').onclick = showHelp;

/* ---------- boucle ---------- */
let lastT = performance.now(), T = 0;
function frame(now){
  requestAnimationFrame(frame); if (document.hidden) { lastT = now; return; }
  const dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = now; T += dt;
  physics(dt); zones(dt);
  me.av.root.position.copy(me.pos); me.av.root.rotation.y = me.yaw; animate(me.av, me.speed, !me.ground, dt);
  for (const o of others.values()) {
    if (o.target) { o.pos.lerp(o.target, Math.min(1, dt * 10)); let dy = ((o.tyaw - o.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; o.yaw += dy * Math.min(1, dt * 10); }
    o.av.root.position.copy(o.pos); o.av.root.rotation.y = o.yaw; animate(o.av, o.a === 1 ? 6 : 0, o.a === 2, dt);
    if (o.bubble && (o.bubbleT -= dt) <= 0) { o.av.root.remove(o.bubble); o.bubble = null; }
  }
  if (me.bubble && (me.bubbleT -= dt) <= 0) { me.av.root.remove(me.bubble); me.bubble = null; }
  if (blocksDirty) rebuildBlocks();
  vinyl.rotation.y += dt * .5; trophy.rotation.y += dt * 1.2; coins.forEach(c => { c.m.rotation.z += dt * 2.5; });
  portals.forEach((p, i) => { p.veil.material.opacity = .32 + Math.sin(T * 2 + i) * .14; });
  window.LAVA2.material.opacity = .18 + Math.sin(T * 1.7) * .08;
  if (pLife > 0) { pLife -= dt; for (let i = 0; i < PN; i++) { pVel[i*3+1] -= 9 * dt; pPos[i*3] += pVel[i*3] * dt; pPos[i*3+1] += pVel[i*3+1] * dt; pPos[i*3+2] += pVel[i*3+2] * dt; } pGeo.attributes.position.needsUpdate = true; if (pLife <= 0) parts.visible = false; }
  updateCam(); renderer.render(scene, cam); sendPos();
}
$('coinsP').textContent = '🪙 ' + coinCount;
$('load').remove(); requestAnimationFrame(frame); connect();
if (firstTime) editAvatar(true); else if (!ls.get('arc_world_help', 0)) showHelp();
canvas.focus({preventScroll: true});
</script>
