  const targets = sel >= 0 ? cur.filter(m => m.from === sel) : [];
  for (let i = 0; i < 64; i++) {
    const sq = flipped ? 63 - i : i, r = sq >> 3, c = sq & 7, d = squares[i], p = st.b[sq], tg = targets.find(m => m.to === sq);
    d.dataset.sq = sq;
    d.className = 'sq ' + ((r + c) % 2 ? 'd' : 'l') + (last && (last.from === sq || last.to === sq) ? ' last' : '') + (hintMv && (hintMv.from === sq || hintMv.to === sq) ? ' hint' : '') + (sq === sel ? ' sel' : '') + (sq === chk ? ' chk' : '') + (tg ? (p || tg.ep ? ' ring' : ' dot') : '');
    d.innerHTML = (p ? '<span class="pc ' + colOf(p) + '">' + glyph(p) + '</span>' : '') + (i >= 56 ? '<span class="co f">' + 'abcdefgh'[c] + '</span>' : '') + ((i & 7) === 0 ? '<span class="co r">' + (8 - r) + '</span>' : '');
    d.setAttribute('aria-label', sqName(sq) + (p ? ', ' + NAME[p.toLowerCase()] + (colOf(p) === 'w' ? ' blanc' : ' noir') : ''));
  }
  // bandeaux joueurs
  const count = col => { const o = {p: 8, n: 2, b: 2, r: 2, q: 1}; st.b.forEach(x => { if (x && colOf(x) === col) { const t = x.toLowerCase(); if (o[t] !== undefined) o[t]--; } }); return o; };
  const capBy = col => { const lost = count(col === 'w' ? 'b' : 'w'), side = col === 'w' ? 'b' : 'w'; return ['q', 'r', 'b', 'n', 'p'].map(t => (side === 'w' ? GLYPH[t] : GLYPH[t]).repeat(Math.max(0, lost[t]))).join(''); };
  const mat = st.b.reduce((s, x) => x ? s + (colOf(x) === 'w' ? 1 : -1) * VAL[x.toLowerCase()] : s, 0) / 100;
  const label = col => mode === 'ai' ? (col === human ? '👤 Toi (' + (col === 'w' ? 'Blancs' : 'Noirs') + ')' : '🤖 Ordinateur · ' + LEVELS[level].n) : (col === 'w' ? '⚪ Blancs' : '⚫ Noirs');
  const bar = col => '<span class="turn"></span><span>' + label(col) + '</span><span class="cap" aria-hidden="true">' + capBy(col) + '</span>' + ((col === 'w' ? mat : -mat) > 0 ? '<span class="adv">+' + Math.round(col === 'w' ? mat : -mat) + '</span>' : '');
  const topCol = flipped ? 'w' : 'b', botCol = flipped ? 'b' : 'w';
  $('pTop').innerHTML = bar(topCol); $('pBot').innerHTML = bar(botCol);
  $('pTop').classList.toggle('on', !over && st.turn === topCol); $('pBot').classList.toggle('on', !over && st.turn === botCol);
  // statut
  const s = $('status'); let txt, warn = false;
  if (over) txt = resultText();
  else if (thinking) txt = '🤖 L\'ordinateur réfléchit…';
  else { txt = mode === 'ai' ? (st.turn === human ? 'À toi de jouer' : '') : (st.turn === 'w' ? 'Aux Blancs de jouer' : 'Aux Noirs de jouer'); if (chk >= 0) { txt += (txt ? ' — ' : '') + 'Échec !'; warn = true; } }
  s.textContent = txt; s.classList.toggle('warn', warn);
  // coups
  let h = ''; for (let i = 0; i < hist.length; i += 2) h += '<span class="n">' + (i / 2 + 1) + '.</span><span' + (i === hist.length - 1 ? ' class="cur"' : '') + '>' + hist[i].san + '</span><span' + (i + 1 === hist.length - 1 ? ' class="cur"' : '') + '>' + (hist[i + 1] ? hist[i + 1].san : '') + '</span>';
  const ml = $('moves'); ml.innerHTML = h || '<span class="note" style="grid-column:1/-1">Aucun coup joué.</span>'; ml.scrollTop = ml.scrollHeight;
  $('undoBtn').disabled = thinking || !hist.length || (mode === 'ai' && !hist.some((x, i) => (i % 2 === 0) === (human === 'w')));
  $('hintBtn').disabled = thinking || !!over || (mode === 'ai' && st.turn !== human);
  // réglages
  $('modeSeg').innerHTML = [['ai', '🤖 Contre l\'ordi'], ['pvp', '👥 À deux']].map(m => '<button type="button" data-v="' + m[0] + '" class="' + (m[0] === mode ? 'on' : '') + '">' + m[1] + '</button>').join('');
  $('lvlSeg').innerHTML = LEVELS.map((l, i) => '<button type="button" data-v="' + i + '" class="' + (i === level ? 'on' : '') + '">' + l.n + '</button>').join('');
  $('colSeg').innerHTML = [['w', '⚪ Blancs'], ['b', '⚫ Noirs'], ['r', '🎲 Au hasard']].map(m => '<button type="button" data-v="' + m[0] + '" class="' + (m[0] === colorPref ? 'on' : '') + '">' + m[1] + '</button>').join('');
  $('aiOpts').classList.toggle('hide', mode !== 'ai');
  const sv = ls.get('arc_chess', {}); $('stats').innerHTML = 'Contre l\'ordinateur : <b>' + (sv.w | 0) + '</b> victoire' + ((sv.w | 0) > 1 ? 's' : '') + ', <b>' + (sv.d | 0) + '</b> nul' + ((sv.d | 0) > 1 ? 's' : '') + ', <b>' + (sv.l | 0) + '</b> défaite' + ((sv.l | 0) > 1 ? 's' : '') + '.';
}
function resultText(){
  if (!over) return '';
  if (over.type === 'mate') return mode === 'ai' ? (over.winner === human ? '🏆 Échec et mat : tu gagnes !' : 'Échec et mat : l\'ordinateur gagne.') : 'Échec et mat : les ' + (over.winner === 'w' ? 'Blancs' : 'Noirs') + ' gagnent !';
  return {stale: '🤝 Pat : match nul.', fifty: '🤝 Nulle (règle des 50 coups).', rep: '🤝 Nulle par triple répétition.', mat: '🤝 Nulle : plus assez de pièces pour mater.'}[over.type];
}

/* ---------- jeu ---------- */
function newGame(){
  gameId++; pending = null; st = initState(); hist = []; keys = {}; keys[key(st)] = 1; cur = legal(st); sel = -1; over = null; thinking = false; hintMv = null; counted = false;
  human = colorPref === 'r' ? (Math.random() < .5 ? 'w' : 'b') : colorPref; flipped = mode === 'ai' && human === 'b';
  closeModal(); save(); render(); maybeAI();
}
function onSq(sq){
  if (over || thinking || (mode === 'ai' && st.turn !== human)) return;
  if (sel >= 0) { const c = cur.filter(m => m.from === sel && m.to === sq); if (c.length) { if (c.length > 1) askPromo(c); else play(c[0]); return; } }
  if (st.b[sq] && colOf(st.b[sq]) === st.turn && cur.some(m => m.from === sq)) { sel = sel === sq ? -1 : sq; sfx.click(); } else sel = -1;
  render();
}
function askPromo(c){
  modal('Promotion', '<p class="note">Ton pion arrive au bout : choisis sa nouvelle pièce.</p>', ['q', 'r', 'b', 'n'].map(t => [glyph(t) + ' ' + NAME[t][0].toUpperCase() + NAME[t].slice(1), () => play(c.find(m => m.promo === t))]).concat([['Annuler', () => { sel = -1; render(); }, true]]));
}
function play(m){
  const s = san(st, m, cur); hist.push({st, m: {from: m.from, to: m.to, promo: m.promo || null}, san: s});
  st = make(st, m); const k = key(st); keys[k] = (keys[k] || 0) + 1; cur = legal(st); sel = -1; hintMv = null;
  (m.cap ? sfx.cap : sfx.move)(); if (cur.length && inCheck(st, st.turn)) tone(990, .05, .16, 'square', .05);
  if (!cur.length) over = inCheck(st, st.turn) ? {type: 'mate', winner: st.turn === 'w' ? 'b' : 'w'} : {type: 'stale'};
  else if (st.half >= 100) over = {type: 'fifty'}; else if (keys[k] >= 3) over = {type: 'rep'}; else if (insufficient(st.b)) over = {type: 'mat'};
  save(); render();
  if (over) finish(); else maybeAI();
}
function maybeAI(){
  if (mode !== 'ai' || over || st.turn === human) return;
  thinking = true; render(); const lv = LEVELS[level];
  setTimeout(() => ask({id: gameId, st, depth: lv.d, noise: lv.noise}), 380);
}
function onAI(d){
  if (pending && d.id === pending.id) pending = null;
  if (typeof d.id === 'string') { if (d.id === 'h' + gameId + '-' + hist.length && d.m) { hintMv = d.m; render(); } return; }
  if (d.id !== gameId || !thinking) return; thinking = false;
  const m = d.m && cur.find(x => x.from === d.m.from && x.to === d.m.to && (x.promo || null) === (d.m.promo || null));
  if (m) play(m); else render();
}
function finish(){
  if (!counted) { counted = true; stat('arc_chess', v => { v.g = (v.g | 0) + 1; if (mode === 'ai') { if (over.type === 'mate') { if (over.winner === human) v.w = (v.w | 0) + 1; else v.l = (v.l | 0) + 1; } else v.d = (v.d | 0) + 1; } }); }
  const win = over.type === 'mate' && (mode !== 'ai' || over.winner === human), lose = mode === 'ai' && over.type === 'mate' && over.winner !== human;
  (win ? sfx.win : lose ? sfx.lose : sfx.ok)(); render();
  setTimeout(() => modal(over.type === 'mate' ? (lose ? 'Perdu…' : 'Victoire !') : 'Match nul', '<p class="note">' + esc(resultText()) + '<br>' + Math.ceil(hist.length / 2) + ' coups joués.</p>', [['Rejouer', newGame], ['Voir l\'échiquier', null, true]]), 650);
}
function undo(){
  if (thinking || !hist.length) return;
  do { const h = hist.pop(); const k = key(st); if (keys[k]) keys[k]--; st = h.st; } while (mode === 'ai' && hist.length && st.turn !== human);
  cur = legal(st); sel = -1; over = null; hintMv = null; sfx.click(); save(); render(); maybeAI();
}
function save(){ if (over || !hist.length) { try { localStorage.removeItem('arc_chess_save'); } catch(e) {} return; } ls.set('arc_chess_save', {mode, level, human, flipped, moves: hist.map(h => h.m)}); }
function restore(){
  const sv = ls.get('arc_chess_save', null); if (!sv || !Array.isArray(sv.moves) || !sv.moves.length) return false;
  mode = sv.mode === 'pvp' ? 'pvp' : 'ai'; level = LEVELS[sv.level] ? sv.level : 1; human = sv.human === 'b' ? 'b' : 'w'; flipped = !!sv.flipped;
  st = initState(); hist = []; keys = {}; keys[key(st)] = 1; cur = legal(st);
  for (const mv of sv.moves) { const m = cur.find(x => x.from === mv.from && x.to === mv.to && (x.promo || null) === (mv.promo || null)); if (!m) break; const s = san(st, m, cur); hist.push({st, m: mv, san: s}); st = make(st, m); const k = key(st); keys[k] = (keys[k] || 0) + 1; cur = legal(st); }
  return hist.length > 0;
}

$('newBtn').onclick = () => { if (hist.length && !over) modal('Nouvelle partie ?', '<p class="note">La partie en cours sera abandonnée.</p>', [['Oui, recommencer', newGame], ['Continuer', null, true]]); else newGame(); };
$('undoBtn').onclick = undo;
$('flipBtn').onclick = () => { flipped = !flipped; sfx.click(); save(); render(); };
$('hintBtn').onclick = () => { if (thinking || over) return; sfx.click(); toast('Recherche du meilleur coup…', 1500); ask({id: 'h' + gameId + '-' + hist.length, st, depth: 2, noise: 0}); };
$('modeSeg').onclick = e => { const v = e.target.dataset.v; if (!v || v === mode) return; mode = v; ls.set('arc_chess_mode', v); sfx.click(); if (!hist.length) newGame(); else { render(); toast('Nouveau mode appliqué à la prochaine partie.'); } };
$('lvlSeg').onclick = e => { const v = e.target.dataset.v; if (v === undefined) return; level = +v; ls.set('arc_chess_lvl', level); sfx.click(); save(); render(); };
$('colSeg').onclick = e => { const v = e.target.dataset.v; if (!v) return; colorPref = v; ls.set('arc_chess_col', v); sfx.click(); if (!hist.length) newGame(); else { render(); toast('Couleur appliquée à la prochaine partie.'); } };
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); } });

if (restore()) { gameId++; over = null; render(); toast('Partie précédente reprise.'); maybeAI(); } else newGame();
</script>
</body>
